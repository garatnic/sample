<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>地底全部掘る v0.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141b24;color:#edf3f5;font-family:system-ui,sans-serif}
main{max-width:760px;margin:auto;padding:12px}h1{font-size:23px;margin:8px 0 4px}p{color:#b8c8ce;font-size:13px;line-height:1.6}
.panel{background:#22313d;border:1px solid #405362;border-radius:11px;padding:10px;margin:9px 0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;text-align:center}
.stats strong{font-size:21px;display:block}.stats small{font-size:11px;color:#bacbd3}
canvas{width:100%;display:block;background:#322a28;border-radius:8px;image-rendering:pixelated}
.buttons,.upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
button{padding:11px 5px;border-radius:8px;background:#3d6177;border:1px solid #7393a5;color:white;font-weight:700}
button:disabled{opacity:.4}.meter{height:13px;background:#43515a;border-radius:8px;overflow:hidden;margin:7px 0}
.meter>div{background:#6ce2a0;height:100%;width:0}
.log{white-space:pre-line;height:96px;overflow:auto;font-size:12px;line-height:1.7;color:#c2d2d9}
.hint{font-size:12px;color:#b8c8ce}.board{position:relative}
.overlay{position:absolute;top:12px;left:12px;right:12px;text-align:center;background:#111b25e8;padding:10px;border-radius:8px}
</style></head>
<body><main>
<h1>⛏️ 地底全部掘る</h1>
<p>画面内の地下をすべて掘り尽くそう！ 小さなブロックを採掘ロボが1マス掘るたび拠点へ戻り、鉱石を売って設備を強化します。</p>
<div class="stats">
<div class="panel"><strong id="coins">0</strong><small>💰 コイン</small></div>
<div class="panel"><strong id="done">0</strong><small>採掘済み</small></div>
<div class="panel"><strong id="bots">1</strong><small>採掘ロボ</small></div>
<div class="panel"><strong id="time">0:00</strong><small>経過時間</small></div>
</div>
<div class="board"><canvas id="map" width="600" height="480" aria-label="固定画面の地底採掘フィールド"></canvas>
<div id="overlay" class="overlay">▶ 開始を押すと1台のロボが1マスずつ採掘・帰還します</div></div>
<div class="panel"><b>地底の採掘率</b> <span id="pct">0.00%</span>
<div class="meter"><div id="bar"></div></div><div class="hint" id="remaining"></div></div>
<div class="buttons"><button id="start">▶ 開始</button><button id="speed">速度 ×1</button><button id="reset">↻ リセット</button></div>
<div class="panel"><b>設備アップグレード</b>
<div class="upgrades" style="margin-top:9px"><button id="drill"></button><button id="transport"></button><button id="hire"></button></div>
<p class="hint">ドリルで掘削速度を、搬送設備で鉱石売却額を強化。ロボットも増設できます。</p></div>
<div class="panel"><b>採掘ログ</b><div class="log" id="log"></div></div>
<p class="hint">固定画面 600×480px、1ブロック 2.4×2.4px（元の24×24pxの縦横1/10）。全250×200マス（基地周辺の空白を除く）。元の「地底採掘」とは独立したゲームです。</p>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),canvas=$('map'),ctx=canvas.getContext('2d');
const COLS=250,ROWS=200,TILE=2.4,BASE_X=125,BASE_Y=5,BASE_RADIUS=5;
let total=0;
const terrain=document.createElement('canvas');terrain.width=COLS;terrain.height=ROWS;
const tctx=terrain.getContext('2d',{alpha:false});
const palette=['#392d29','#6a5140','#424044','#597f8b','#b39a6b','#f2c55d'];
const worth=[0,1,2,4,8,16];
let cells,workers,coins,dug,drill,transport,elapsed,playing,won,speed,last,acc,logs,workerId;
function log(message){logs.unshift('• '+message);logs=logs.slice(0,30);$('log').textContent=logs.join('\n')}
function makeCells(){
 cells=new Uint8Array(COLS*ROWS);total=0;
 const img=tctx.createImageData(COLS,ROWS);
 const rgb=[[25,38,49],[106,81,64],[66,64,68],[89,127,139],[179,154,107],[242,197,93]];
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  const i=y*COLS+x,k=i*4;
  const r=Math.random(),depth=y/ROWS;
  const blank=Math.hypot(x-BASE_X,y-BASE_Y)*TILE<=12;
  const v=blank?0:r<.01+depth*.02?5:r<.045+depth*.05?4:r<.11+depth*.07?3:r<.24+depth*.09?2:1;
  cells[i]=v;if(v)total++;
  for(let c=0;c<3;c++)img.data[k+c]=rgb[v][c];img.data[k+3]=255;
 }
 tctx.putImageData(img,0,0);
}
function newWorker(){
 const w={id:workerId++,x:BASE_X,y:BASE_Y,mode:'choose',path:[],target:-1,ore:0,progress:0};
 workers.push(w);return w;
}
function neighbors(i){
 const x=i%COLS,y=(i/COLS)|0,arr=[];
 if(x>0)arr.push(i-1);if(x<COLS-1)arr.push(i+1);
 if(y>0)arr.push(i-COLS);if(y<ROWS-1)arr.push(i+COLS);
 return arr;
}
function findRoute(){
 // Breadth-first search through empty cells only: the first solid neighbor is the nearest mineable block.
 const start=BASE_Y*COLS+BASE_X,q=new Int32Array(COLS*ROWS),prev=new Int32Array(COLS*ROWS);
 prev.fill(-1);let head=0,tail=1;q[0]=start;prev[start]=start;
 const reserved=new Set(workers.filter(w=>w.target>=0).map(w=>w.target));
 while(head<tail){
  const cur=q[head++];
  for(const n of neighbors(cur)){
   if(cells[n]!==0&&!reserved.has(n)){
    const path=[];let p=cur;
    while(p!==start){path.push(p);p=prev[p]}
    path.push(start);path.reverse();
    return {path,target:n};
   }
  }
  for(const n of neighbors(cur)){
   if(cells[n]===0&&prev[n]<0){prev[n]=cur;q[tail++]=n}
  }
 }
 return null;
}
function reset(){
 coins=0;dug=0;drill=1;transport=1;elapsed=0;playing=false;won=false;speed=1;last=0;acc=0;logs=[];workers=[];workerId=1;
 makeCells();newWorker();
 $('speed').textContent='速度 ×1';$('overlay').hidden=false;$('overlay').textContent='▶ 開始を押すと1台のロボが基地から近い順に掘ります';
 log('基地周囲12pxを空洞にしました。採掘対象 '+total.toLocaleString('ja-JP')+' マス');update();
}
function advance(w,dt){
 if(!w.path.length)return true;
 const p=w.path[0],tx=p%COLS,ty=(p/COLS)|0;
 const dx=tx-w.x,dy=ty-w.y,d=Math.hypot(dx,dy),step=dt*24;
 if(d<=step){w.x=tx;w.y=ty;w.path.shift();return w.path.length===0}
 w.x+=dx/d*step;w.y+=dy/d*step;return false;
}
function tick(dt){
 if(won)return;elapsed+=dt;
 for(const w of workers){
  if(w.mode==='choose'){
   const result=findRoute();
   if(!result){w.mode='idle';continue}
   w.target=result.target;w.path=result.path.slice(1);w.mode='out';
  }
  if(w.mode==='out'){
   if(advance(w,dt))w.mode='mine';
  }else if(w.mode==='mine'){
   w.progress+=dt*(1.5+drill*.7);
   if(w.progress>=1){
    w.progress=0;
    const i=w.target,ore=cells[i];
    if(ore){
     cells[i]=0;const x=i%COLS,y=(i/COLS)|0;
     tctx.fillStyle='#192631';tctx.fillRect(x,y,1,1);
     dug++;w.ore=worth[ore];
     if(ore===5&&dug%73===0)log('金鉱石を採掘！');
    }
    // Return along the exact traversable path, never through intact blocks.
    const result=findReturnPath(w);
    w.path=result;w.mode='return';w.target=-1;
   }
  }else if(w.mode==='return'){
   if(advance(w,dt)){
    coins+=w.ore*transport;w.ore=0;w.mode='choose';
   }
  }else if(w.mode==='idle'&&dug<total){w.mode='choose'}
 }
 if(dug>=total&&workers.every(w=>w.mode==='choose'||w.mode==='idle')){
  won=true;playing=false;$('overlay').hidden=false;
  $('overlay').textContent='🎉 地底全部掘った！ 全'+total.toLocaleString('ja-JP')+'マス完全採掘！';
  log('完全採掘達成！');
 }
 update();
}
function findReturnPath(w){
 // Reconstruct shortest route through empty cells from the worker's current position to base.
 const start=Math.round(w.y)*COLS+Math.round(w.x),end=BASE_Y*COLS+BASE_X;
 const q=new Int32Array(COLS*ROWS),prev=new Int32Array(COLS*ROWS);
 prev.fill(-1);let head=0,tail=1;q[0]=start;prev[start]=start;
 while(head<tail&&prev[end]<0){
  const cur=q[head++];
  for(const n of neighbors(cur))if(cells[n]===0&&prev[n]<0){prev[n]=cur;q[tail++]=n}
 }
 if(prev[end]<0)return [];
 const path=[];let p=end;
 while(p!==start){path.push(p);p=prev[p]}
 return path.reverse();
}
const drillCost=()=>20*drill;
const transportCost=()=>35*transport;
const hireCost=()=>80+(workers.length-1)*6;
function update(){
 $('coins').textContent=Math.floor(coins).toLocaleString('ja-JP');
 $('done').textContent=dug.toLocaleString('ja-JP')+'/'+total.toLocaleString('ja-JP');
 $('bots').textContent=workers.length;
 $('time').textContent=Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');
 const pct=dug/total*100;
 $('pct').textContent=pct.toFixed(2)+'%';$('bar').style.width=pct+'%';
 $('remaining').textContent='残り '+(total-dug).toLocaleString('ja-JP')+' ブロック';
 $('start').textContent=playing?'Ⅱ 一時停止':'▶ '+(elapsed?'再開':'開始');
 $('start').disabled=won;
 const costs=[drillCost(),transportCost(),hireCost()];
 $('drill').textContent='⚙️ ドリル Lv.'+drill+'\n'+costs[0]+'G';
 $('transport').textContent='📦 搬送 Lv.'+transport+'\n'+costs[1]+'G';
 $('hire').textContent='🤖 ロボ追加 ('+workers.length+')\n'+costs[2]+'G';
 ['drill','transport','hire'].forEach((id,i)=>$(id).disabled=won||coins<costs[i]||(i===2&&workers.length>=50));
}
function draw(){
 ctx.imageSmoothingEnabled=false;
 ctx.drawImage(terrain,0,0,canvas.width,canvas.height);
 ctx.fillStyle='#f2d081';ctx.fillRect((BASE_X-4)*TILE,(BASE_Y-3)*TILE,8*TILE,6*TILE);ctx.fillStyle='#152631';ctx.font='10px sans-serif';ctx.fillText('基地',(BASE_X-4)*TILE,(BASE_Y-3)*TILE-2);
 // Worker markers remain readable despite the 2.4px terrain cells.
 for(const w of workers){
  if(w.mode==='idle')continue;
  const x=(w.x+.5)*TILE,y=(w.y+.5)*TILE;
  ctx.fillStyle='#111c27';ctx.fillRect(x-1.5,y-1.5,3,3);
  ctx.fillStyle=w.id%3===0?'#7bd7ff':w.id%3===1?'#ffdd72':'#b7f59b';
  ctx.fillRect(x-1,y-1,2,2);
  if(w.ore){ctx.fillStyle='#ffe58d';ctx.fillRect(x-1,y-6,3,3)}
 }
}
function frame(t){
 const dt=Math.min(.08,(t-last)/1000||.016);last=t;
 if(playing){acc+=dt*speed;let n=0;while(acc>=.04&&n++<30){tick(.04);acc-=.04}}
 draw();requestAnimationFrame(frame);
}
$('start').onclick=()=>{if(won)return;playing=!playing;$('overlay').hidden=playing;$('overlay').textContent='一時停止中';update()};
$('speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;$('speed').textContent='速度 ×'+speed};
$('reset').onclick=reset;
$('drill').onclick=()=>{const cost=drillCost();if(coins>=cost&&!won){coins-=cost;drill++;log('ドリル Lv.'+drill+' に強化');update()}};
$('transport').onclick=()=>{const cost=transportCost();if(coins>=cost&&!won){coins-=cost;transport++;log('搬送設備 Lv.'+transport+' に強化');update()}};
$('hire').onclick=()=>{const cost=hireCost();if(coins>=cost&&workers.length<50&&!won){coins-=cost;newWorker();log('ロボット '+workers.length+'台に増設');update()}};
reset();requestAnimationFrame(frame);
})();
</script></body></html>
