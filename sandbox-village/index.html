<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自動発展する箱庭村 v0.1</title><style>*{box-sizing:border-box}body{margin:0;background:#14221d;color:#eaf5eb;font-family:system-ui,sans-serif}.wrap{max-width:680px;margin:auto;padding:14px}h1{font-size:22px;margin:8px 0 4px}p{color:#bad0c0;font-size:13px}.panel{background:#21372e;border:1px solid #45604e;border-radius:12px;padding:11px;margin:10px 0}canvas{width:100%;display:block;border-radius:12px;background:#77a66a}.board{position:relative}.overlay{position:absolute;top:12px;left:12px;right:12px;text-align:center;background:#12251de8;border-radius:9px;padding:10px;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stats>div{text-align:center}.stats strong{display:block;font-size:21px}.stats small{color:#c1d5c5;font-size:11px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}button{border:1px solid #779984;background:#335b44;color:white;border-radius:9px;padding:12px 4px;font-weight:700}.log{white-space:pre-line;max-height:135px;overflow:auto;font-size:12px;line-height:1.7;color:#d3e5d5}.legend{font-size:12px;line-height:1.8}.footer{font-size:11px;color:#9eb6a4}</style></head><body><main class="wrap"><h1>🌿 ちいさな箱庭村</h1><p>住人たちが自分で資源を集め、家を建て、村を育てていきます。</p><div class="stats"><div class="panel"><strong id="pop">3</strong><small>人口</small></div><div class="panel"><strong id="wood">0</strong><small>🪵 木材</small></div><div class="panel"><strong id="food">0</strong><small>🍎 食料</small></div><div class="panel"><strong id="houses">1</strong><small>🏠 家</small></div></div><div class="board"><canvas id="world" width="600" height="480" aria-label="自動発展する村のマップ"></canvas><div class="overlay" id="overlay">▶ 開始を押すと村が動き出します</div></div><div class="buttons"><button id="start">▶ 開始</button><button id="speed">速度 ×1</button><button id="reset">↻ リセット</button></div><div class="panel legend">🧑 住人　🌲 森（木材）　🍓 茂み（食料）　🏠 家　🟫 建設予定地<br><span id="day">1日目</span> · <span id="status">住人たちは待機中</span></div><div class="panel"><b>村のできごと</b><div class="log" id="log"></div></div><div class="footer">v0.1 · 自動行動 / 資源採集 / 建築 / 人口増加 / 速度切替。データはリセットで初期化されます。</div></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),c=$('world'),g=c.getContext('2d'),W=600,H=480,R=Math.random;
let villagers,trees,berries,homes,wood,food,day,progress,run=false,speed=1,last=0,acc=0,logs=[],buildSite=null,building=0,birthCooldown=0,simTick=0;
const rand=(a,b)=>a+R()*(b-a),distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),spot=()=>({x:rand(35,W-35),y:rand(45,H-35)});
function log(t){logs.unshift('📅 '+day+'日目：'+t);logs=logs.slice(0,40);$('log').textContent=logs.join('\n')}
function villager(x,y){return {x,y,tx:x,ty:y,job:'考え中',target:null,carry:null,work:0,speed:rand(.85,1.2),color:['#f59e0b','#60a5fa','#f472b6','#a78bfa','#4ade80'][villagers.length%5]}}
function reset(){villagers=[];trees=[];berries=[];homes=[{x:295,y:230}];wood=3;food=16;day=1;progress=0;buildSite=null;building=0;birthCooldown=0;simTick=0;logs=[];for(let i=0;i<18;i++)trees.push({...spot(),amount:rand(7,15),max:15});for(let i=0;i<13;i++)berries.push({...spot(),amount:rand(5,11),max:11});for(let i=0;i<3;i++)villagers.push(villager(280+i*14,260));log('3人で村を作り始めました');update()}
function nearest(v,items){return items.filter(o=>o.amount>1).sort((a,b)=>distance(a,v)-distance(b,v))[0]}
function choose(v){if(v.carry){v.tx=homes[0].x+rand(-20,20);v.ty=homes[0].y+rand(10,30);v.job='運搬';return}
if(buildSite&&wood>=0&&building<100&&R()<.35){v.tx=buildSite.x;v.ty=buildSite.y;v.job='建築';return}
let target=(food<Math.max(9,villagers.length*5)||R()<.48)?nearest(v,berries):nearest(v,trees);if(!target)target=nearest(v,berries)||nearest(v,trees);
if(target){v.target=target;v.tx=target.x;v.ty=target.y;v.job=berries.includes(target)?'食料採集':'伐採'}else{v.tx=rand(60,540);v.ty=rand(60,420);v.job='散歩'}}
function update(){$('pop').textContent=villagers.length;$('wood').textContent=Math.floor(wood);$('food').textContent=Math.floor(food);$('houses').textContent=homes.length;$('day').textContent=day+'日目';$('status').textContent=buildSite?'家を建築中 '+Math.floor(building)+'%':wood>=12?'新しい家を計画中':'採集と村づくり';$('start').textContent=run?'Ⅱ 停止':'▶ 再開'}
function step(){simTick++;progress++;if(progress>=140){progress=0;day++;food=Math.max(0,food-villagers.length*.55);birthCooldown=Math.max(0,birthCooldown-1);for(let t of trees)t.amount=Math.min(t.max,t.amount+.8);for(let b of berries)b.amount=Math.min(b.max,b.amount+1.7);if(food<2)log('食料が不足しています');update()}
if(!buildSite&&wood>=12&&homes.length<10){let n=homes.length,angle=n*2.39996,r=72+Math.sqrt(n)*29;buildSite={x:Math.max(45,Math.min(W-45,295+Math.cos(angle)*r)),y:Math.max(55,Math.min(H-45,230+Math.sin(angle)*r))};wood-=12;building=0;log('新しい家の建設を開始')}
for(let v of villagers){if(v.work>0){v.work--;continue}if(distance(v,{x:v.tx,y:v.ty})>3){let dx=v.tx-v.x,dy=v.ty-v.y,d=Math.hypot(dx,dy),s=Math.min(d,v.speed*1.5);v.x+=dx/d*s;v.y+=dy/d*s;continue}
if(v.job==='運搬'&&v.carry){if(v.carry==='wood')wood+=3;else food+=4;v.carry=null;v.job='考え中';v.target=null}
else if((v.job==='伐採'||v.job==='食料採集')&&v.target&&v.target.amount>=1){v.target.amount=Math.max(0,v.target.amount-2.5);v.carry=v.job==='伐採'?'wood':'food';v.work=12;v.job='運搬';v.target=null}
else if(v.job==='建築'&&buildSite){building+=2.5;v.work=7;if(building>=100){homes.push(buildSite);buildSite=null;building=0;log('家が完成！ 住める人数が増えました')}}
choose(v)}
if(!buildSite&&villagers.length<homes.length*4&&food>=villagers.length*3+6&&birthCooldown===0){food-=6;birthCooldown=3;let h=homes[Math.floor(R()*homes.length)];villagers.push(villager(h.x+rand(-15,15),h.y+20));log('新しい住人がやってきました！ 人口 '+villagers.length+'人')}
if(simTick%20===0)update()}
function tree(t){g.fillStyle='#694a31';g.fillRect(t.x-3,t.y-3,6,17);g.fillStyle=t.amount>1?'#236747':'#708875';for(let [dx,dy,r] of [[0,-13,15],[-9,-6,12],[9,-6,12]]){g.beginPath();g.arc(t.x+dx,t.y+dy,r,0,Math.PI*2);g.fill()}}
function house(h){g.fillStyle='#d6b48c';g.fillRect(h.x-20,h.y-11,40,31);g.fillStyle='#9b5341';g.beginPath();g.moveTo(h.x-26,h.y-10);g.lineTo(h.x,h.y-31);g.lineTo(h.x+26,h.y-10);g.closePath();g.fill();g.fillStyle='#6e4536';g.fillRect(h.x-5,h.y+3,10,17);g.fillStyle='#fff2b0';g.fillRect(h.x-15,h.y-4,8,8)}
function draw(){g.fillStyle='#88b979';g.fillRect(0,0,W,H);g.fillStyle='#7caa6e';for(let i=0;i<95;i++){let x=(i*127+19)%W,y=(i*79+31)%H;g.fillRect(x,y,3,3)}
g.fillStyle='#b5a078';g.beginPath();g.ellipse(295,245,105,75,0,0,Math.PI*2);g.fill();
for(let t of trees)tree(t);for(let b of berries){g.fillStyle='#3b8b43';g.beginPath();g.arc(b.x,b.y,9,0,Math.PI*2);g.fill();if(b.amount>1){g.fillStyle='#e74659';for(let [dx,dy] of [[-4,0],[3,-4],[4,4]]){g.beginPath();g.arc(b.x+dx,b.y+dy,2.5,0,Math.PI*2);g.fill()}}}
for(let h of homes)house(h);
if(buildSite){g.fillStyle='#a5754e';g.fillRect(buildSite.x-20,buildSite.y-15,40,35);g.strokeStyle='#f7e4a1';g.lineWidth=3;g.strokeRect(buildSite.x-20,buildSite.y-15,40,35);g.fillStyle='#233d2d';g.fillRect(buildSite.x-22,buildSite.y-25,44,5);g.fillStyle='#f6d365';g.fillRect(buildSite.x-22,buildSite.y-25,44*building/100,5)}
for(let v of villagers){g.fillStyle='#0004';g.beginPath();g.ellipse(v.x,v.y+6,8,4,0,0,Math.PI*2);g.fill();g.fillStyle=v.color;g.beginPath();g.arc(v.x,v.y,7,0,Math.PI*2);g.fill();g.strokeStyle='#273e30';g.lineWidth=1.5;g.stroke();g.fillStyle='#ffddba';g.beginPath();g.arc(v.x,v.y-5,4,0,Math.PI*2);g.fill();if(v.carry){g.font='12px sans-serif';g.textAlign='center';g.fillText(v.carry==='wood'?'🪵':'🍎',v.x,v.y-14)}}
}
function frame(t){let dt=Math.min(100,t-last||16);last=t;if(run){acc+=dt*speed;let n=0;while(acc>=30&&n++<25){step();acc-=30}}draw();requestAnimationFrame(frame)}
$('start').onclick=()=>{run=!run;$('overlay').hidden=run;$('overlay').textContent='一時停止中';update()};
$('speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;$('speed').textContent='速度 ×'+speed};
$('reset').onclick=()=>{run=false;reset();$('overlay').hidden=false;$('overlay').textContent='▶ 開始を押すと村が動き出します'};
reset();requestAnimationFrame(frame);
})();
</script></body></html>
