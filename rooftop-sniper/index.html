<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rooftop Sniper</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0e13;color:#fff;font-family:system-ui,sans-serif;overscroll-behavior:none}main{max-width:520px;margin:auto;padding:10px}.hud{display:flex;justify-content:space-between;padding:8px;font-weight:bold;font-size:14px}#scene{position:relative;width:100%;aspect-ratio:360/410;overflow:hidden;background:#7899aa;border-radius:10px 10px 0 0}#scene svg{display:block;width:100%;height:100%}#targets{position:absolute;inset:0;pointer-events:none}.target{position:absolute;transform:translate(-50%,-100%);pointer-events:none}#scope{position:absolute;width:56px;height:56px;border:2px solid white;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 1px 2px black)}#scope:before{content:"";position:absolute;top:50%;left:-10px;width:72px;border-top:1px solid white}#scope:after{content:"";position:absolute;left:50%;top:-10px;height:72px;border-left:1px solid white}#scope .zoom{position:absolute;inset:0;border-radius:50%;overflow:hidden;z-index:-1;background:#506b7e}#scope .zoom-inner{position:absolute;width:360px;height:410px;transform-origin:top left;pointer-events:none}#scope i{position:absolute;left:50%;top:50%;width:5px;height:5px;background:#f44;border-radius:50%;transform:translate(-50%,-50%)}#pad{height:clamp(220px,34dvh,380px);background:#050505;touch-action:none;user-select:none;display:flex;align-items:center;justify-content:center;color:#727983;font-size:14px;text-align:center;border-radius:0 0 10px 10px}#pad.active{background:#10151b}button{background:#e9bf65;color:#181818;border:0;border-radius:9px;padding:11px 18px;font-weight:800}footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;font-size:12px;color:#b6c1cc}#overlay{position:absolute;inset:0;background:#101a2be0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:20px;z-index:10}#overlay h2{margin:0}#overlay p{font-size:13px;line-height:1.7}.burst{position:absolute;border:2px solid #ffe6a0;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);animation:burst .3s forwards;pointer-events:none}@keyframes burst{to{opacity:0;transform:translate(-50%,-50%) scale(4)}}
</style></head><body><main>
<div class="hud"><span>得点 <b id="score">0</b></span><span>命中 <b id="hits">0</b></span><span>体力 <b id="hp">♥♥♥♥♥</b></span><span>残り <b id="time">60</b>秒</span></div>
<div id="scene"><svg viewBox="0 0 360 410" preserveAspectRatio="none"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#41678b"/><stop offset="1" stop-color="#c2d2d2"/></linearGradient><pattern id="win" width="23" height="28" patternUnits="userSpaceOnUse"><rect x="5" y="7" width="11" height="15" fill="#a2bdc7" opacity=".7"/></pattern></defs><rect width="360" height="410" fill="url(#sky)"/><circle cx="292" cy="65" r="26" fill="#f0dca8" opacity=".7"/><g fill="#6c8292"><rect y="166" width="52" height="244"/><rect x="48" y="185" width="66" height="225"/><rect x="238" y="150" width="65" height="260"/><rect x="300" y="185" width="60" height="225"/></g><rect x="13" y="210" width="102" height="200" fill="#516b7d"/><rect x="13" y="210" width="102" height="200" fill="url(#win)"/><rect x="10" y="205" width="108" height="8" fill="#344c5b"/><rect x="125" y="135" width="112" height="275" fill="#697c89"/><rect x="125" y="135" width="112" height="275" fill="url(#win)"/><rect x="121" y="130" width="120" height="9" fill="#465966"/><rect x="250" y="240" width="105" height="170" fill="#435b6d"/><rect x="250" y="240" width="105" height="170" fill="url(#win)"/><rect x="246" y="235" width="114" height="9" fill="#2f4655"/><path d="M140 130V112H170V130M198 130V105H220V130M47 205V189H77V205M280 235V219H320V235" stroke="#293f4d" stroke-width="2" fill="none"/></svg>
<div id="targets"></div><div id="scope"><div class="zoom"><div id="zoom-inner" class="zoom-inner"></div></div><i></i></div><div id="overlay"><h2 id="title">ROOFTOP SNIPER</h2><p id="desc">下の黒いエリアをスワイプして照準移動<br>指を離すと射撃<br>敵は約5秒で赤くなり発砲！ 体力は5<br>遠くの小さな標的ほど高得点</p><button id="start">ゲーム開始</button></div></div>
<div id="pad">ここをスワイプして照準を動かす<br>指を離して発射</div>
<footer><span id="status">黒いエリアで操作</span><button id="restart">リスタート</button></footer></main>
<script>
(()=>{const $=id=>document.getElementById(id),scene=$('scene'),pad=$('pad'),layer=$('targets'),scope=$('scope'),spots=[{x:45,y:205,r:24,s:19,p:150},{x:88,y:205,r:19,s:19,p:150},{x:155,y:130,r:20,s:13,p:300},{x:207,y:130,r:18,s:13,p:300},{x:284,y:235,r:20,s:23,p:100},{x:325,y:235,r:17,s:23,p:100},{x:158,y:205,r:7,s:12,p:250},{x:208,y:260,r:7,s:12,p:250}];let targets=[],score=0,hits=0,time=60,hp=5,playing=false,ax=180,ay=205,held=false,px=0,py=0,last=0,raf=0,spawnClock=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function hud(){$('score').textContent=score;$('hits').textContent=hits;$('time').textContent=Math.ceil(time);$('hp').textContent='♥'.repeat(hp)+'♡'.repeat(5-hp)}function drawAim(){scope.style.left=ax/360*100+'%';scope.style.top=ay/410*100+'%';zoom()}function zoom(){const z=$('zoom-inner'),rect=scope.getBoundingClientRect(),w=scene.clientWidth/360,h=scene.clientHeight/410,mag=2.5;z.style.width=scene.clientWidth+'px';z.style.height=scene.clientHeight+'px';z.style.transform='translate('+(28-ax*w*mag)+'px,'+(28-ay*h*mag)+'px) scale('+mag+')';z.innerHTML=scene.querySelector('svg').outerHTML+layer.outerHTML;z.querySelector('svg').style.width='100%';z.querySelector('svg').style.height='100%';let tl=z.querySelector('#targets');if(tl){tl.removeAttribute('id');tl.style.position='absolute';tl.style.inset='0'}}function remove(t){t.node.remove();targets=targets.filter(v=>v!==t)}function spawn(){if(targets.length>=3)return;let choices=spots.map((s,i)=>i).filter(i=>!targets.some(t=>t.i===i));if(!choices.length)return;let i=choices[Math.floor(Math.random()*choices.length)],s=spots[i],node=document.createElement('div');node.className='target';node.innerHTML='<svg viewBox="0 0 24 40" width="100%" height="100%"><ellipse cx="12" cy="7" rx="5" ry="6" fill="#dfb38b"/><path d="M5 15H19L21 29H3Z" fill="#b94b43"/><path d="M8 29L7 40M16 29L17 40" stroke="#263440" stroke-width="5"/><path d="M5 18L1 27M19 18L23 27" stroke="#d8a780" stroke-width="3"/></svg>';layer.appendChild(node);targets.push({i,s,node,age:0,life:14+Math.random()*12,charge:0,phase:Math.random()*6.28,x:s.x,hidden:false})}function shoot(){let m=document.createElement('div');m.className='burst';m.style.left=ax/360*100+'%';m.style.top=ay/410*100+'%';scene.appendChild(m);setTimeout(()=>m.remove(),320);let hit=targets.find(t=>!t.hidden&&Math.abs(ax-t.x)<t.s.s*.43&&ay>=t.s.y-t.s.s*1.65&&ay<=t.s.y);if(hit){score+=hit.s.p;hits++;remove(hit);$('status').textContent='命中！ +'+hit.s.p+'点';spawnClock=1.5;hud()}else $('status').textContent='ミスショット'}function end(reason='TIME UP'){playing=false;cancelAnimationFrame(raf);$('title').textContent=reason;$('desc').textContent='得点 '+score+'点 ／ 命中 '+hits+'体';$('start').textContent='もう一度プレイ';$('overlay').style.display='flex'}function frame(t){if(!playing)return;let dt=Math.min((t-last)/1000,.05);last=t;time-=dt;if(time<=0){time=0;hud();end();return}spawnClock-=dt;if(spawnClock<=0){spawn();spawnClock=3+Math.random()*2}for(let v of [...targets]){v.age+=dt;v.charge+=dt;v.phase+=dt*.95;v.x=v.s.x+Math.sin(v.phase)*v.s.r;v.hidden=Math.sin(v.age*.9+v.i*2)>.93;v.node.style.display=v.hidden?'none':'block';v.node.style.filter='sepia('+Math.min(1,v.charge/5)+') saturate('+ (1+Math.min(1,v.charge/5)*5)+') hue-rotate('+(-Math.min(1,v.charge/5)*18)+'deg)';v.node.style.opacity=1;v.node.style.left=v.x/360*100+'%';v.node.style.top=v.s.y/410*100+'%';v.node.style.width=v.s.s/360*100+'%';v.node.style.height=v.s.s*1.65/410*100+'%';if(v.charge>=5){v.charge=0;hp--;hud();$('status').textContent='敵から被弾！';scene.style.outline='3px solid #e33';setTimeout(()=>scene.style.outline='',180);if(hp<=0){end('GAME OVER');return}}if(v.age>v.life)remove(v)}hud();zoom();raf=requestAnimationFrame(frame)}function start(){cancelAnimationFrame(raf);targets.forEach(t=>t.node.remove());targets=[];score=0;hits=0;time=60;hp=5;ax=180;ay=205;held=false;spawnClock=2.5;playing=true;drawAim();hud();$('overlay').style.display='none';$('status').textContent='黒いエリアで照準を操作';spawn();last=performance.now();raf=requestAnimationFrame(frame)}pad.addEventListener('pointerdown',e=>{if(!playing)return;held=true;px=e.clientX;py=e.clientY;pad.setPointerCapture(e.pointerId);pad.classList.add('active');e.preventDefault()});pad.addEventListener('pointermove',e=>{if(!held||!playing)return;let r=scene.getBoundingClientRect();ax=clamp(ax+(e.clientX-px)*360/r.width,0,360);ay=clamp(ay+(e.clientY-py)*410/r.height,0,410);px=e.clientX;py=e.clientY;drawAim();e.preventDefault()});pad.addEventListener('pointerup',e=>{if(!held)return;held=false;pad.classList.remove('active');if(playing)shoot();e.preventDefault()});pad.addEventListener('pointercancel',()=>{held=false;pad.classList.remove('active')});$('start').addEventListener('click',start);$('restart').addEventListener('click',start);drawAim();hud()})();
</script></body></html>
