<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>森のサバイバル</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1713;color:white;font-family:system-ui;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#hud{position:absolute;top:12px;left:12px;pointer-events:none;text-shadow:0 2px 4px #000;font-weight:bold}#hud small{font-weight:normal}#stick{position:absolute;left:25px;bottom:35px;width:132px;height:132px;border-radius:50%;border:3px solid #ffffff55;background:#ffffff19;touch-action:none}#knob{position:absolute;width:56px;height:56px;left:35px;top:35px;background:#ffffff80;border:2px solid white;border-radius:50%}#restart{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);padding:15px 26px;border:0;border-radius:10px;font-size:18px;display:none}</style><canvas id="game"></canvas><div id="hud">森のサバイバル <small>Ver.0.1</small><div id="stats"></div><small>移動：左下スティック / WASD・矢印キー　攻撃：自動</small></div><div id="stick"><div id="knob"></div></div><button id="restart">もう一度</button><script>
const c=document.querySelector('#game'),g=c.getContext('2d'),stats=document.querySelector('#stats'),stick=document.querySelector('#stick'),knob=document.querySelector('#knob'),restart=document.querySelector('#restart');
let W,H,dpr,player,enemies,particles,score,time,spawn,dead=false;const keys={},joy={x:0,y:0};function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
let seed=7;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const trees=[],rocks=[];for(let i=0;i<700;i++){trees.push({x:rand()*4200-2100,y:rand()*4200-2100,r:12+rand()*19,t:rand()})}for(let i=0;i<240;i++)rocks.push({x:rand()*4200-2100,y:rand()*4200-2100,r:3+rand()*8});
function roadY(x){return 90*Math.sin(x/260)+45*Math.sin(x/110)}function init(){player={x:0,y:0,hp:100,max:100,level:1,exp:0,attack:0};enemies=[];particles=[];score=0;time=0;spawn=0;dead=false;restart.style.display='none';}init();
function mob(){const a=rand()*Math.PI*2,r=Math.max(W,H)*.7+100;enemies.push({x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,hp:30+Math.floor(time/25)*8,max:30+Math.floor(time/25)*8,s:30+rand()*20,hit:0})}
function dot(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}
function draw(){g.clearRect(0,0,W,H);g.save();g.translate(W/2-player.x,H/2-player.y);rect(player.x-W/2,player.y-H/2,W,H,'#223e30');
const l=player.x-W/2-50,r=player.x+W/2+50,t=player.y-H/2-50,b=player.y+H/2+50;
for(let x=Math.floor(l/55)*55;x<r;x+=55)for(let y=Math.floor(t/55)*55;y<b;y+=55){let v=Math.abs(Math.sin(x*12.9898+y*78.233));dot(x+v*30,y+v*20,2,'#345640')}
g.beginPath();for(let x=l;x<=r;x+=8){let y=roadY(x);if(x===l)g.moveTo(x,y);else g.lineTo(x,y)}g.lineWidth=95;g.strokeStyle='#2c372b';g.stroke();g.lineWidth=76;g.strokeStyle='#7d7655';g.stroke();g.lineWidth=66;g.strokeStyle='#9b8c62';g.stroke();
for(const o of rocks)if(o.x>l&&o.x<r&&o.y>t&&o.y<b){dot(o.x+2,o.y+3,o.r,'#152c25');dot(o.x,o.y,o.r,'#7d8576')}
for(const o of trees)if(o.x>l-35&&o.x<r+35&&o.y>t-35&&o.y<b+35&&Math.abs(o.y-roadY(o.x))>65){dot(o.x+6,o.y+8,o.r,'#0c251c');dot(o.x,o.y,o.r,'#153e2a');dot(o.x-4,o.y-4,o.r*.7,o.t>.5?'#286747':'#20563a');dot(o.x-8,o.y-9,o.r*.32,'#397a50')}
for(const e of enemies){dot(e.x+3,e.y+7,13,'#15271c');dot(e.x,e.y,12,'#8e4737');dot(e.x-4,e.y-3,3,'#c7aa80');dot(e.x+4,e.y-3,3,'#c7aa80');rect(e.x-15,e.y-23,30,4,'#431b19');rect(e.x-15,e.y-23,30*Math.max(0,e.hp/e.max),4,'#e05242')}
for(const p of particles){g.globalAlpha=Math.max(0,p.life/.6);g.fillStyle=p.color;g.font='bold 17px system-ui';g.fillText(p.text,p.x,p.y);g.globalAlpha=1}
dot(player.x+3,player.y+9,16,'#10241b');dot(player.x,player.y,14,'#e7a63d');dot(player.x,player.y-6,12,'#e8b64e');dot(player.x-5,player.y-9,3,'#263d30');dot(player.x+5,player.y-9,3,'#263d30');rect(player.x-21,player.y-32,42,6,'#2b2828');rect(player.x-21,player.y-32,42*player.hp/player.max,6,'#5bdf70');g.restore();
rect(W-125,12,112,112,'#10251fdd');g.save();g.beginPath();g.rect(W-121,16,104,104);g.clip();for(const e of enemies)dot(W-69+(e.x-player.x)*.09,68+(e.y-player.y)*.09,2,'#f06b58');dot(W-69,68,4,'#f7d84c');g.restore();g.strokeStyle='#a9bba5';g.strokeRect(W-125,12,112,112);
stats.textContent='HP '+Math.ceil(player.hp)+'/100  |  討伐 '+score+'  |  Lv.'+player.level+'  |  '+Math.floor(time)+'秒';
if(dead){rect(0,0,W,H,'#0009');g.textAlign='center';g.fillStyle='white';g.font='bold 34px system-ui';g.fillText('ゲームオーバー',W/2,H*.43);g.font='20px system-ui';g.fillText('討伐 '+score+' 体',W/2,H*.49);g.textAlign='left'}}
let last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.04);last=now;if(!dead){time+=dt;spawn-=dt;if(spawn<=0&&enemies.length<85){mob();spawn=Math.max(.32,1.2-time*.006)}let dx=joy.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=joy.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),len=Math.hypot(dx,dy);if(len>0){player.x+=dx/Math.max(1,len)*175*dt;player.y+=dy/Math.max(1,len)*175*dt}player.attack-=dt;let nearest=null,dist=1e9;for(const e of enemies){let x=player.x-e.x,y=player.y-e.y,d=Math.hypot(x,y)||1;if(d<dist){nearest=e;dist=d}if(d>18){e.x+=x/d*e.s*dt;e.y+=y/d*e.s*dt}else{e.hit-=dt;if(e.hit<=0){player.hp=Math.max(0,player.hp-7);e.hit=.85;particles.push({x:player.x,y:player.y-25,text:'-7',color:'#ff7777',life:.6});if(player.hp<=0){dead=true;restart.style.display='block'}}}}if(nearest&&dist<190&&player.attack<=0){nearest.hp-=20+player.level*3;player.attack=.35;particles.push({x:nearest.x,y:nearest.y-25,text:'-'+(20+player.level*3),color:'#ffe06d',life:.6});if(nearest.hp<=0){enemies.splice(enemies.indexOf(nearest),1);score++;player.exp++;if(player.exp>=8+player.level*4){player.exp=0;player.level++;player.hp=Math.min(100,player.hp+25);particles.push({x:player.x,y:player.y-45,text:'LEVEL UP!',color:'#7affac',life:1})}}}for(const p of particles){p.y-=30*dt;p.life-=dt}particles=particles.filter(p=>p.life>0)}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);
function move(e){const r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.max(1,Math.hypot(x,y)),m=Math.min(d,45);joy.x=x/d*m/45;joy.y=y/d*m/45;knob.style.transform='translate('+joy.x*45+'px,'+joy.y*45+'px)'}
stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);move(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))move(e)});function release(){joy.x=joy.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);restart.onclick=init;
</script></html>
