<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WANTED CITY</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#111923;color:#f6f6f6;font-family:system-ui,sans-serif;overscroll-behavior:none}main{max-width:520px;height:100dvh;margin:auto;padding:5px;display:flex;flex-direction:column;overflow:hidden}.hud{display:flex;justify-content:space-between;padding:6px 3px;font-size:13px;font-weight:700}#scene{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:9px 9px 0 0;background:#7b8d76}#map{position:absolute;width:100%;height:100%;inset:0}#people{position:absolute;inset:0;pointer-events:none}.person{position:absolute;transform:translate(-50%,-50%);pointer-events:none}#scope{position:absolute;left:50%;top:50%;width:76px;height:76px;transform:translate(-50%,-50%);border:2px solid white;border-radius:50%;z-index:7;pointer-events:none;box-shadow:0 0 0 1px #1c2c36,0 0 9px #0009}#scope:before{content:"";position:absolute;left:-12px;right:-12px;top:50%;border-top:1px solid white}#scope:after{content:"";position:absolute;top:-12px;bottom:-12px;left:50%;border-left:1px solid white}#scope .dot{position:absolute;left:50%;top:50%;width:5px;height:5px;background:#ff4d4d;border-radius:50%;transform:translate(-50%,-50%)}#lens{position:absolute;inset:0;border-radius:50%;overflow:hidden;z-index:-1;background:#7b8d76}#lensInner{position:absolute;top:0;left:0;transform-origin:top left}#poster{position:absolute;top:7px;left:7px;z-index:8;display:flex;gap:5px;align-items:center;background:#e7d4a6;color:#342516;border:2px solid #9f8052;padding:4px;border-radius:7px;box-shadow:0 2px 8px #0008}#portrait{width:50px;height:56px;border:1px solid #92754d;background:#b6a383}#portrait svg{width:100%;height:100%}#poster strong{font-size:11px;letter-spacing:1px}#wantedName{display:block;font-size:10px;margin-top:4px}#pad{flex:none;height:clamp(150px,28dvh,260px);background:#050608;touch-action:none;user-select:none;display:flex;align-items:center;justify-content:center;text-align:center;color:#687481;font-size:13px;border-radius:0 0 9px 9px}#pad.active{background:#101923}#overlay{position:absolute;inset:0;z-index:12;background:#101d2fe8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:20px}#overlay h2{margin:0}#overlay p{font-size:13px;line-height:1.8}button{background:#edc16c;color:#211b12;border:0;border-radius:9px;padding:10px 15px;font-weight:800}footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:7px;font-size:12px;color:#b6c7d2}.burst{position:absolute;width:18px;height:18px;border:2px solid #ffe3a1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:10;animation:burst .3s forwards}@keyframes burst{to{opacity:0;transform:translate(-50%,-50%) scale(4)}}@media(max-height:650px){#pad{height:135px}.hud{padding:3px}}
</style></head><body><main><div class="hud"><span>得点 <b id="score">0</b></span><span>正解 <b id="hits">0</b></span><span>誤射 <b id="mistakes">0</b></span><span>残り <b id="time">90</b>秒</span></div><div id="scene">
<svg id="map" viewBox="0 0 360 480" preserveAspectRatio="none"><defs><pattern id="grass" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#849979"/><circle cx="5" cy="7" r="2" fill="#718e69"/><circle cx="20" cy="19" r="2" fill="#a0aa7f"/></pattern><pattern id="roof" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 0H22V22H0Z" fill="#b49c85"/><path d="M0 11H22M11 0V22" stroke="#a18b76" stroke-width=".6"/></pattern></defs><rect width="360" height="480" fill="url(#grass)"/><g fill="#c9c4ae"><rect x="56" width="54" height="480"/><rect x="157" width="52" height="480"/><rect x="260" width="54" height="480"/><rect y="75" width="360" height="53"/><rect y="216" width="360" height="53"/><rect y="358" width="360" height="53"/></g><g fill="#515d64"><rect x="64" width="38" height="480"/><rect x="164" width="38" height="480"/><rect x="268" width="38" height="480"/><rect y="83" width="360" height="37"/><rect y="224" width="360" height="37"/><rect y="366" width="360" height="37"/></g><g stroke="#e2d8b2" stroke-width="1.6" stroke-dasharray="8 10" opacity=".8"><path d="M83 0V480M183 0V480M287 0V480M0 101.5H360M0 242.5H360M0 384.5H360"/></g><g fill="url(#roof)" stroke="#655a51" stroke-width="2"><rect x="10" y="13" width="36" height="49" rx="2"/><rect x="115" y="10" width="35" height="50" rx="2"/><rect x="217" y="12" width="36" height="51" rx="2"/><rect x="318" y="15" width="32" height="48" rx="2"/><rect x="9" y="142" width="38" height="62" rx="2"/><rect x="115" y="144" width="36" height="59" rx="2"/><rect x="216" y="145" width="36" height="59" rx="2"/><rect x="317" y="144" width="34" height="59" rx="2"/><rect x="10" y="283" width="36" height="61" rx="2"/><rect x="115" y="286" width="35" height="57" rx="2"/><rect x="218" y="284" width="34" height="61" rx="2"/><rect x="318" y="286" width="32" height="58" rx="2"/><rect x="10" y="426" width="36" height="44" rx="2"/><rect x="115" y="425" width="35" height="44" rx="2"/><rect x="216" y="426" width="36" height="44" rx="2"/><rect x="318" y="427" width="32" height="43" rx="2"/></g><g fill="#648d60"><circle cx="25" cy="73" r="7"/><circle cx="235" cy="74" r="7"/><circle cx="334" cy="277" r="8"/><circle cx="131" cy="418" r="6"/></g></svg>
<div id="people"></div><div id="scope"><div id="lens"><div id="lensInner"></div></div><div class="dot"></div></div><div id="poster"><div id="portrait"></div><div><strong>WANTED</strong><b id="wantedName">ターゲット</b></div></div>
<div id="overlay"><h2 id="title">WANTED CITY</h2><p id="desc">上空から街を見渡して指名手配犯を探そう！<br>20人が道を歩き、交差点で曲がります。<br>黒いエリアをスワイプ、指を離して射撃。</p><button id="start">ゲーム開始</button></div></div><div id="pad">ここをスワイプして照準を移動<br>指を離すと射撃</div><footer><span id="status">正解 +500 / 誤射 -200</span><button id="restart">リスタート</button></footer></main>
<script>
(()=>{const $=id=>document.getElementById(id),scene=$('scene'),pad=$('pad'),layer=$('people'),scope=$('scope'),colors=['#e45353','#4ba4e5','#f3c54e','#64b67c','#a67bd6','#e78c4d','#54bcb5','#d16ba5','#8b99aa','#a5c747','#d86932','#287ba0','#b99a47','#426d43','#cb84e5','#b65a81','#33a48d','#7e574c','#5767d4','#d2adba'],names=['アカマル','アオボウ','キイロ','ミドリン','ムラサキ','オレンジ','ミント','ピンク','グレー','ライム','レンガ','アオミズ','コガネ','モリ','フジ','ローズ','クジャク','ココア','インディゴ','サクラ'];const xs=[83,183,287],ys=[101.5,242.5,384.5];let people=[],wanted=null,score=0,hits=0,mistakes=0,time=90,playing=false,ax=180,ay=240,held=false,px=0,py=0,last=0,raf=0;
function portrait(id){let c=colors[id],hat=id%4,eyes=id%3;return '<svg viewBox="0 0 40 52" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="33" width="32" height="19" rx="7" fill="'+c+'"/><circle cx="20" cy="23" r="13" fill="#e4b58f" stroke="#8c6952"/>'+(hat===0?'<path d="M7 17Q20 -2 33 17Z" fill="'+c+'"/>':hat===1?'<path d="M6 16H34L30 10H10Z" fill="#344354"/>':hat===2?'<path d="M7 17Q20 2 33 17" stroke="#6b4638" stroke-width="7" fill="none"/>':'<path d="M10 12L20 4L30 12" fill="'+c+'"/>')+(eyes===0?'<rect x="11" y="22" width="18" height="6" rx="2" fill="#293846"/>':eyes===1?'<circle cx="15" cy="25" r="2"/><circle cx="25" cy="25" r="2"/>':'<path d="M12 24H18M22 24H28" stroke="#263442" stroke-width="2"/>')+'<path d="M15 32Q20 35 25 32" stroke="#915f51" fill="none"/></svg>'}
function topView(id){let c=colors[id],hat=id%4;return '<svg viewBox="0 0 28 28" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><ellipse cx="14" cy="17" rx="12" ry="10" fill="'+c+'" stroke="#29333a" stroke-width="1.5"/><circle cx="14" cy="12" r="8" fill="'+(hat===1?'#344354':hat===2?'#76513b':hat===3?'#e5b58e':c)+'" stroke="#2e353b" stroke-width="1.2"/><path d="M10 18L18 18" stroke="#202b31" stroke-width="1.5"/></svg>'}
function hud(){$('score').textContent=score;$('hits').textContent=hits;$('mistakes').textContent=mistakes;$('time').textContent=Math.ceil(time)}
function aim(){scope.style.left=ax/360*100+'%';scope.style.top=ay/480*100+'%';zoom()}
function zoom(){let z=$('lensInner'),w=scene.clientWidth,h=scene.clientHeight,m=1.7;z.style.width=w+'px';z.style.height=h+'px';z.style.transform='translate('+(38-ax*w/360*m)+'px,'+(38-ay*h/480*m)+'px) scale('+m+')';z.innerHTML=$('map').outerHTML+layer.outerHTML;let map=z.querySelector('#map');map.removeAttribute('id');map.style.width='100%';map.style.height='100%';let p=z.querySelector('#people');p.removeAttribute('id');p.style.position='absolute';p.style.inset='0'}
function chooseDirection(p){let opts=[];for(let d of [[1,0],[-1,0],[0,1],[0,-1]]){if(d[0]&&p.yAxis===null)continue;if(d[1]&&p.xAxis===null)continue;opts.push(d)}if(!opts.length)return;let d=opts[Math.floor(Math.random()*opts.length)];p.dx=d[0];p.dy=d[1]}
function makePeople(){layer.innerHTML='';people=[];for(let id=0;id<20;id++){let vertical=Math.random()<.5,xi=Math.floor(Math.random()*3),yi=Math.floor(Math.random()*3),x=vertical?xs[xi]:Math.random()*360,y=vertical?Math.random()*480:ys[yi];let node=document.createElement('div');node.className='person';node.innerHTML=topView(id);layer.appendChild(node);let p={id,node,x,y,dx:vertical?0:(Math.random()<.5?1:-1),dy:vertical?(Math.random()<.5?1:-1):0,xAxis:vertical?xi:null,yAxis:vertical?null:yi,speed:11+Math.random()*11,turnCooldown:0};people.push(p)}wanted=people[Math.floor(Math.random()*people.length)];$('portrait').innerHTML=portrait(wanted.id);$('wantedName').textContent=names[wanted.id];$('status').textContent='指名手配の人物を探そう';positionPeople();zoom()}
function positionPeople(){for(let p of people){p.node.style.left=p.x/360*100+'%';p.node.style.top=p.y/480*100+'%';p.node.style.width='5.2%';p.node.style.height='3.9%'}}
function move(dt){for(let p of people){let oldX=p.x,oldY=p.y;p.x+=p.dx*p.speed*dt;p.y+=p.dy*p.speed*dt;p.turnCooldown=Math.max(0,p.turnCooldown-dt);if(p.dx){for(let i=0;i<3;i++){if((oldX-xs[i])*(p.x-xs[i])<=0&&p.turnCooldown===0&&Math.random()<.48){p.x=xs[i];p.xAxis=i;p.yAxis=null;p.dx=0;p.dy=Math.random()<.5?1:-1;p.turnCooldown=.6;break}}}else{for(let i=0;i<3;i++){if((oldY-ys[i])*(p.y-ys[i])<=0&&p.turnCooldown===0&&Math.random()<.48){p.y=ys[i];p.yAxis=i;p.xAxis=null;p.dy=0;p.dx=Math.random()<.5?1:-1;p.turnCooldown=.6;break}}}if(p.x<0)p.x=360;if(p.x>360)p.x=0;if(p.y<0)p.y=480;if(p.y>480)p.y=0}positionPeople()}
function shoot(){let m=document.createElement('div');m.className='burst';m.style.left=ax/360*100+'%';m.style.top=ay/480*100+'%';scene.appendChild(m);setTimeout(()=>m.remove(),300);let p=[...people].reverse().find(p=>Math.hypot((ax-p.x)*scene.clientWidth/360,(ay-p.y)*scene.clientHeight/480)<Math.max(10,scene.clientWidth*.027));if(!p){$('status').textContent='空振り';return}if(p.id===wanted.id){score+=500;hits++;makePeople();$('status').textContent='正解！ +500点'}else{score=Math.max(0,score-200);mistakes++;$('status').textContent='違う人物！ -200点'}hud()}
function end(){playing=false;cancelAnimationFrame(raf);$('title').textContent='TIME UP';$('desc').textContent='得点 '+score+'点 / 正解 '+hits+'人 / 誤射 '+mistakes+'人';$('start').textContent='もう一度';$('overlay').style.display='flex'}
function frame(t){if(!playing)return;let dt=Math.min(.05,(t-last)/1000);last=t;time-=dt;if(time<=0){time=0;hud();end();return}move(dt);zoom();hud();raf=requestAnimationFrame(frame)}
function start(){cancelAnimationFrame(raf);score=0;hits=0;mistakes=0;time=90;ax=180;ay=240;playing=true;held=false;$('overlay').style.display='none';makePeople();aim();hud();last=performance.now();raf=requestAnimationFrame(frame)}
pad.addEventListener('pointerdown',e=>{if(!playing)return;held=true;px=e.clientX;py=e.clientY;pad.setPointerCapture(e.pointerId);pad.classList.add('active');e.preventDefault()});pad.addEventListener('pointermove',e=>{if(!held||!playing)return;let r=scene.getBoundingClientRect();ax=Math.max(0,Math.min(360,ax+(e.clientX-px)*360/r.width));ay=Math.max(0,Math.min(480,ay+(e.clientY-py)*480/r.height));px=e.clientX;py=e.clientY;aim();e.preventDefault()});pad.addEventListener('pointerup',e=>{if(!held)return;held=false;pad.classList.remove('active');if(playing)shoot();e.preventDefault()});pad.addEventListener('pointercancel',()=>{held=false;pad.classList.remove('active')});$('start').addEventListener('click',start);$('restart').addEventListener('click',start);aim();hud()})();
</script></body></html>
