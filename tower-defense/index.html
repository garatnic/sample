<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>タワーディフェンス v0.1</title><style>*{box-sizing:border-box}body{margin:0;background:#101b23;color:#edf5ef;font-family:system-ui,sans-serif}.wrap{max-width:700px;margin:auto;padding:14px}h1{font-size:23px;margin:8px 0}p,.hint{font-size:12px;color:#b7c7c6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.panel{background:#21333b;border:1px solid #3b5861;border-radius:11px;padding:10px;margin:8px 0}.stats .panel{text-align:center}.stats strong{font-size:21px;display:block}.stats small{font-size:11px;color:#a9c0c3}.board{position:relative}canvas{width:100%;display:block;border-radius:10px;background:#668f65;touch-action:manipulation}.overlay{position:absolute;top:12px;left:12px;right:12px;text-align:center;background:#12202cdd;border-radius:8px;padding:10px;font-size:13px}.controls,.towers{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}button{border:1px solid #668590;border-radius:9px;background:#345668;color:white;padding:11px 5px;font-weight:650}button.active{background:#b58a43;color:#171e23;border-color:#f3d38d}button:disabled{opacity:.45}.log{height:85px;overflow:auto;white-space:pre-line;font-size:12px;line-height:1.6;color:#b7c7c6}.legend{font-size:12px;color:#c3d4d4}</style></head><body><main class="wrap"><h1>🏰 タワーディフェンス</h1><p>道の外をタップして砲台を設置。敵を倒して基地を守ろう！</p><div class="stats"><div class="panel"><strong id="hp">20</strong><small>基地HP</small></div><div class="panel"><strong id="gold">180</strong><small>💰 コイン</small></div><div class="panel"><strong id="wave">1</strong><small>ウェーブ</small></div><div class="panel"><strong id="kills">0</strong><small>討伐数</small></div></div><div class="board"><canvas id="game" width="600" height="480" aria-label="タワーディフェンスのマップ"></canvas><div id="overlay" class="overlay">砲台を選び、道の外に設置して開始！</div></div><div class="towers"><button data-type="rapid" class="active">🔵 連射砲<br>50G</button><button data-type="heavy">🟠 重砲<br>90G</button><button data-type="splash">🟣 範囲砲<br>120G</button></div><div class="controls"><button id="start">▶ 開始</button><button id="speed">速度 ×1</button><button id="reset">↻ リセット</button></div><div class="panel"><b>砲台の操作</b><p class="hint" id="info">連射砲：低コスト・高連射。砲台をタップすると強化できます。</p><button id="upgrade" disabled>砲台を選択して強化</button><div class="legend">🔵 連射　🟠 高火力　🟣 範囲攻撃　赤＝通常敵　黄＝高速敵　紫＝重装敵</div></div><div class="panel"><b>戦闘ログ</b><div id="log" class="log"></div></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('game'),g=cv.getContext('2d'),path=[[-25,80],[125,80],[125,205],[305,205],[305,105],[465,105],[465,335],[225,335],[225,420],[625,420]],types={rapid:{cost:50,range:105,damage:10,rate:.36,color:'#55baf8',label:'連射砲'},heavy:{cost:90,range:145,damage:36,rate:1.25,color:'#f5a64b',label:'重砲'},splash:{cost:120,range:110,damage:18,rate:1.15,color:'#c59af7',label:'範囲砲'}};let towers=[],enemies=[],shots=[],particles=[],gold=180,hp=20,wave=1,kills=0,run=false,speed=1,spawn=0,spawned=0,remaining=0,phase='ready',selectedType='rapid',selected=null,last=0,acc=0,logs=[];
function log(s){logs.unshift('• '+s);logs=logs.slice(0,20);$('log').textContent=logs.join('\n')}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function segmentDist(px,py,a,b){let dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((px-a[0])*dx+(py-a[1])*dy)/(dx*dx+dy*dy)));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)}
function onRoad(x,y){return path.some((p,i)=>i&&segmentDist(x,y,path[i-1],p)<30)}
function reset(){towers=[];enemies=[];shots=[];particles=[];gold=180;hp=20;wave=1;kills=0;run=false;speed=1;spawn=0;spawned=0;remaining=0;phase='ready';selected=null;logs=[];$('speed').textContent='速度 ×1';$('overlay').hidden=false;$('overlay').textContent='砲台を選び、道の外に設置して開始！';log('基地防衛の準備を開始');update()}
function update(){$('hp').textContent=hp;$('gold').textContent=gold;$('wave').textContent=wave;$('kills').textContent=kills;$('start').textContent=run?'Ⅱ 一時停止':'▶ '+(phase==='ready'?'開始':'再開');const cost=selected?Math.floor(types[selected.type].cost*(.75+selected.level*.5)):0;$('upgrade').disabled=!selected||gold<cost||selected.level>=5;$('upgrade').textContent=selected?'⬆ '+types[selected.type].label+' Lv.'+selected.level+' → '+(selected.level+1)+' ('+cost+'G)':'砲台を選択して強化';$('info').textContent=selected?'選択中：'+types[selected.type].label+' Lv.'+selected.level+' / ダメージ '+Math.round(types[selected.type].damage*(1+(selected.level-1)*.65)):types[selectedType].label+'を選択中。空き地をタップして設置'}
function beginWave(){phase='spawning';spawned=0;remaining=7+wave*3;spawn=.5;log('ウェーブ '+wave+' 開始！')}
function createEnemy(){let n=spawned++,kind=n%9===8?'tank':n%4===3?'fast':'normal',scale=1+(wave-1)*.31;enemies.push({x:path[0][0],y:path[0][1],idx:0,hp:(kind==='tank'?105:kind==='fast'?27:46)*scale,max:(kind==='tank'?105:kind==='fast'?27:46)*scale,speed:kind==='tank'?31:kind==='fast'?85:49,color:kind==='tank'?'#b78bf0':kind==='fast'?'#f6d45c':'#f36c69',reward:kind==='tank'?23:kind==='fast'?10:8,dead:false})}
function step(dt){if(phase==='ready')beginWave();if(phase==='spawning'){spawn-=dt;if(spawn<=0&&spawned<remaining){createEnemy();spawn=.85*Math.pow(.98,wave)}if(spawned>=remaining)phase='fighting'}
for(let e of enemies){let step=e.speed*dt;while(step>0&&!e.dead){let next=path[e.idx+1];if(!next){e.dead=true;hp=Math.max(0,hp-(e.color==='#b78bf0'?3:1));if(hp<=0){run=false;phase='over';$('overlay').hidden=false;$('overlay').textContent='ゲームオーバー！ '+wave+'ウェーブまで到達';log('基地が陥落した')}break}let d=Math.hypot(next[0]-e.x,next[1]-e.y);if(d<=step){e.x=next[0];e.y=next[1];e.idx++;step-=d}else{e.x+=(next[0]-e.x)/d*step;e.y+=(next[1]-e.y)/d*step;step=0}}}
for(let t of towers){t.cool-=dt;if(t.cool>0)continue;let cfg=types[t.type],range=cfg.range*(1+(t.level-1)*.08),targets=enemies.filter(e=>!e.dead&&distance(e,t)<range).sort((a,b)=>b.idx-a.idx||distance(a,t)-distance(b,t));if(!targets.length)continue;let e=targets[0];shots.push({x:t.x,y:t.y,tx:e.x,ty:e.y,life:.15,color:cfg.color});let damage=cfg.damage*(1+(t.level-1)*.65);for(let victim of t.type==='splash'?enemies.filter(z=>!z.dead&&distance(z,e)<49):[e]){victim.hp-=damage;if(victim.hp<=0&&!victim.dead){victim.dead=true;kills++;gold+=victim.reward;if(kills%10===0)log('討伐 '+kills+'体 / '+gold+'G')}}t.cool=cfg.rate/(1+(t.level-1)*.1)}
for(let s of shots)s.life-=dt;shots=shots.filter(s=>s.life>0);enemies=enemies.filter(e=>!e.dead);
if(phase==='fighting'&&enemies.length===0){log('ウェーブ '+wave+' を突破！ +'+(20+wave*5)+'G');gold+=20+wave*5;wave++;phase='intermission';spawn=2.5}
if(phase==='intermission'){spawn-=dt;if(spawn<=0)beginWave()}update()}
function draw(){g.fillStyle='#688f67';g.fillRect(0,0,600,480);for(let i=0;i<90;i++){let x=(i*73+17)%600,y=(i*127+33)%480;g.fillStyle='#ffffff10';g.fillRect(x,y,4,4)}
g.lineCap='round';g.lineJoin='round';g.beginPath();path.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.strokeStyle='#45594c';g.lineWidth=67;g.stroke();g.strokeStyle='#c6b28b';g.lineWidth=56;g.stroke();g.strokeStyle='#d9c49a';g.lineWidth=43;g.stroke();g.setLineDash([9,14]);g.strokeStyle='#a68f6c';g.lineWidth=2;g.stroke();g.setLineDash([]);
g.fillStyle='#3d5d70';g.fillRect(556,382,44,76);g.fillStyle='#e9c36c';g.font='bold 15px system-ui';g.textAlign='center';g.fillText('🏰',574,408);
for(let t of towers){let cfg=types[t.type];if(t===selected){g.beginPath();g.arc(t.x,t.y,cfg.range*(1+(t.level-1)*.08),0,Math.PI*2);g.fillStyle='#d6e8fa15';g.fill();g.strokeStyle='#d6e8fa88';g.lineWidth=1;g.stroke()}g.fillStyle='#253947';g.beginPath();g.arc(t.x,t.y,19,0,Math.PI*2);g.fill();g.fillStyle=cfg.color;g.beginPath();g.arc(t.x,t.y,13,0,Math.PI*2);g.fill();g.fillStyle='#152b35';g.fillRect(t.x-4,t.y-17,8,17);g.fillStyle='white';g.font='bold 10px system-ui';g.fillText(t.level,t.x,t.y+5)}
for(let e of enemies){g.fillStyle='#1c242a66';g.beginPath();g.ellipse(e.x,e.y+7,13,5,0,0,Math.PI*2);g.fill();g.fillStyle=e.color;g.beginPath();g.arc(e.x,e.y,e.color==='#b78bf0'?14:10,0,Math.PI*2);g.fill();g.fillStyle='#2c2627';g.fillRect(e.x-13,e.y-20,26,4);g.fillStyle='#67e69a';g.fillRect(e.x-13,e.y-20,26*Math.max(0,e.hp/e.max),4)}
for(let s of shots){g.strokeStyle=s.color;g.lineWidth=3;g.globalAlpha=s.life/.15;g.beginPath();g.moveTo(s.x,s.y);g.lineTo(s.tx,s.ty);g.stroke();g.globalAlpha=1}}
function frame(t){let dt=Math.min(.08,(t-last)/1000||.016);last=t;if(run){acc+=dt*speed;let n=0;while(acc>=.025&&n++<20){step(.025);acc-=.025}}draw();requestAnimationFrame(frame)}
cv.addEventListener('pointerdown',ev=>{let r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)*600/r.width,y=(ev.clientY-r.top)*480/r.height;let existing=towers.find(t=>distance(t,{x,y})<23);if(existing){selected=existing;update();return}selected=null;let cfg=types[selectedType];if(onRoad(x,y)||x<25||x>575||y<25||y>455||towers.some(t=>distance(t,{x,y})<43)){log('そこには建設できません');update();return}if(gold<cfg.cost){log('コインが足りません');update();return}gold-=cfg.cost;towers.push({x,y,type:selectedType,level:1,cool:0});log(cfg.label+'を建設');update()});
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{selectedType=b.dataset.type;selected=null;document.querySelectorAll('[data-type]').forEach(v=>v.classList.toggle('active',v===b));update()});
$('upgrade').onclick=()=>{if(!selected)return;let cost=Math.floor(types[selected.type].cost*(.75+selected.level*.5));if(gold>=cost&&selected.level<5){gold-=cost;selected.level++;log(types[selected.type].label+'を Lv.'+selected.level+' に強化');update()}};
$('start').onclick=()=>{if(phase==='over')return;run=!run;$('overlay').hidden=run;$('overlay').textContent='一時停止中';update()};$('speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;$('speed').textContent='速度 ×'+speed};$('reset').onclick=reset;reset();requestAnimationFrame(frame);
})();
</script></body></html>
