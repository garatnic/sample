<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地底採掘シミュレーター v0.1</title><style>*{box-sizing:border-box}body{margin:0;background:#111721;color:#f1e9d9;font-family:system-ui,sans-serif}.wrap{max-width:720px;margin:auto;padding:14px}h1{font-size:22px;margin:8px 0 4px}p{font-size:13px;color:#bcb7ae}.panel{background:#252b35;border:1px solid #454c57;border-radius:10px;padding:11px;margin:9px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;text-align:center}.stats strong{display:block;font-size:21px}.stats small{font-size:11px;color:#b9b8b5}.board{position:relative}canvas{display:block;width:100%;background:#181c24;border-radius:10px}.overlay{position:absolute;top:10px;left:10px;right:10px;text-align:center;background:#111923e9;padding:9px;border-radius:8px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}button{background:#65503b;color:#fff1d7;border:1px solid #a28b6d;border-radius:8px;padding:12px 4px;font-weight:bold}button:disabled{opacity:.4}.upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.upgrades button{font-size:12px;line-height:1.5}.log{white-space:pre-line;height:110px;overflow:auto;font-size:12px;line-height:1.7;color:#c9c1b7}.hint{font-size:12px;color:#c5b8a8}.meter{height:6px;background:#444a52;border-radius:5px;overflow:hidden;margin:6px 0}.meter div{height:100%;background:#efbd64}</style></head><body><main class="wrap"><h1>⛏️ 地底採掘シミュレーター</h1><p>採掘ロボが地層を掘り、鉱石を回収。資源を売って採掘能力を強化しよう。</p><div class="stats"><div class="panel"><strong id="money">0</strong><small>所持コイン</small></div><div class="panel"><strong id="depth">0m</strong><small>最深到達</small></div><div class="panel"><strong id="mined">0</strong><small>採掘マス</small></div><div class="panel"><strong id="robots">2</strong><small>ロボット</small></div></div><div class="board"><canvas id="world" width="600" height="480" aria-label="地下の採掘状況"></canvas><div class="overlay" id="overlay">▶ 開始を押して採掘スタート</div></div><div class="buttons"><button id="start">▶ 開始</button><button id="speed">速度 ×1</button><button id="reset">↻ リセット</button></div><div class="panel"><b>設備アップグレード</b><div class="upgrades" style="margin-top:9px"><button id="drill"></button><button id="cargo"></button><button id="hire"></button></div><p class="hint">鉱石は地上に運ぶと自動で売却。ロボットは採掘と運搬を自動判断します。</p></div><div class="panel"><b>採掘レポート</b><div class="meter"><div id="fill"></div></div><div id="status" class="hint"></div></div><div class="panel"><b>採掘ログ</b><div id="log" class="log"></div></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('world'),g=canvas.getContext('2d'),C=25,T=24,ROWS=120,rand=n=>Math.floor(Math.random()*n);
let grid,bots,money=0,mined=0,maxDepth=0,drill=1,cargo=1,run=false,speed=1,clock=0,last=0,acc=0,camera=0,logs=[],nextBot=1;
const values=[0,1,3,6,11,20],colors=['#222b33','#76533c','#3b3335','#476c77','#9a8552','#c69d42'],names=['','土','石炭','銅','鉄','金'];
function log(s){logs.unshift('• '+s);logs=logs.slice(0,28);$('log').textContent=logs.join('\n')}
function createBot(){return {id:nextBot++,x:12,y:-.5,tx:12,ty:-.5,job:'探査',target:null,load:0,work:0,color:['#f6ca64','#73d3f4','#e6a1f4','#98df9a'][bots.length%4]}}
function reset(){grid=Array.from({length:ROWS},(_,y)=>Array.from({length:C},(_,x)=>{if(x===0||x===C-1)return 1;let r=Math.random(),deep=y/ROWS;return r<.015+deep*.035?5:r<.06+deep*.06?4:r<.13+deep*.09?3:r<.27+deep*.1?2:1}));grid[0][12]=0;bots=[];nextBot=1;bots.push(createBot(),createBot());money=0;mined=0;maxDepth=0;drill=1;cargo=1;clock=0;camera=0;logs=[];run=false;speed=1;$('speed').textContent='速度 ×1';$('overlay').hidden=false;$('overlay').textContent='▶ 開始を押して採掘スタート';log('採掘基地を設置しました');update()}
function accessible(x,y){return y<0||(x>0&&x<C-1&&y<ROWS&&grid[y]?.[x]===0)}
function neighbors(x,y){return [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].filter(([a,b])=>a>0&&a<C-1&&b>=0&&b<ROWS)}
function route(sx,sy,ex,ey){let start=[Math.max(1,Math.min(C-2,Math.floor(sx))),Math.max(0,Math.floor(sy))],q=[start],visited=new Set([start.join(',')]),prev=new Map;for(let i=0;i<q.length;i++){let [x,y]=q[i];if(x===ex&&y===ey){let p=[],k=x+','+y;while(k!==start.join(',')){let [a,b]=k.split(',').map(Number);p.unshift({x:a,y:b});k=prev.get(k)}return p}for(let [a,b] of neighbors(x,y)){let k=a+','+b;if(!visited.has(k)&&accessible(a,b)){visited.add(k);prev.set(k,x+','+y);q.push([a,b])}}}return []}
function pickTarget(bot){let candidates=[];for(let y=0;y<ROWS;y++)for(let x=1;x<C-1;x++)if(grid[y][x]!==0&&neighbors(x,y).some(([a,b])=>grid[b][a]===0)){let near=neighbors(x,y).filter(([a,b])=>grid[b][a]===0);for(let [a,b] of near){let p=route(bot.x,Math.max(0,bot.y),a,b);if(p.length||Math.abs(bot.x-a)+Math.abs(bot.y-b)<2){let ore=grid[y][x];let score=p.length+Math.abs(bot.y-y)*.1-(values[ore]-1)*.6+Math.random()*3;candidates.push({x,y,px:a,py:b,score})}}}candidates.sort((a,b)=>a.score-b.score);return candidates[0]||null}
function move(bot,tx,ty,dt){let dx=tx-bot.x,dy=ty-bot.y,d=Math.hypot(dx,dy);if(d<.06){bot.x=tx;bot.y=ty;return true}let step=Math.min(d,dt*(2.8+drill*.35));bot.x+=dx/d*step;bot.y+=dy/d*step;return false}
function tick(dt){clock+=dt;for(let b of bots){if(b.load>=cargo*3){b.job='運搬';b.target=null}
if(b.job==='運搬'){let target={x:12,y:0};let p=route(b.x,Math.max(0,b.y),12,0);let dest=p[0]||target;if(move(b,dest.x,dest.y,dt)&&Math.abs(b.x-12)<.2&&b.y<.2){money+=b.load;b.load=0;b.job='探査';log('ロボ #'+b.id+' が鉱石を売却')}continue}
if(!b.target||grid[b.target.y][b.target.x]===0){b.target=pickTarget(b);b.work=0}
if(!b.target)continue;let t=b.target,p=route(b.x,Math.max(0,b.y),t.px,t.py),dest=p[0]||{x:t.px,y:t.py};if(!move(b,dest.x,dest.y,dt))continue;
b.job='掘削';b.work+=dt*drill;if(b.work>=.8+(t.y/ROWS)*1.2){let ore=grid[t.y][t.x];grid[t.y][t.x]=0;mined++;maxDepth=Math.max(maxDepth,t.y+1);b.load+=values[ore];b.target=null;b.work=0;b.job='探査';if(ore===5)log('金鉱石を発見！ 深さ '+(t.y+1)*2+'m');else if(mined%30===0)log('累計 '+mined+'マス採掘')}}
camera+=(Math.max(0,Math.min(ROWS-19,Math.max(...bots.map(b=>b.y))-9))-camera)*Math.min(1,dt*2)}
function update(){$('money').textContent=money;$('depth').textContent=maxDepth*2+'m';$('mined').textContent=mined;$('robots').textContent=bots.length;$('start').textContent=run?'Ⅱ 停止':'▶ '+(clock?'再開':'開始');let costs=[20*drill,18*cargo,30+bots.length*18];$('drill').textContent='⚙️ ドリル Lv.'+drill+'\n'+costs[0]+'G';$('cargo').textContent='📦 運搬 Lv.'+cargo+'\n'+costs[1]+'G';$('hire').textContent='🤖 ロボ追加\n'+costs[2]+'G';['drill','cargo','hire'].forEach((id,i)=>$(id).disabled=money<costs[i]||(i===2&&bots.length>=12));$('fill').style.width=Math.min(100,maxDepth/ROWS*100)+'%';$('status').textContent='地層 '+maxDepth+'/'+ROWS+' ・ 採掘率 '+(mined/(ROWS*(C-2))*100).toFixed(1)+'%'}
function draw(){g.fillStyle='#151e29';g.fillRect(0,0,600,480);g.fillStyle='#4c7a62';g.fillRect(0,0,600,26);g.fillStyle='#324958';g.fillRect(275,0,50,26);g.fillStyle='#f6d67d';g.fillRect(288,0,24,18);g.font='12px sans-serif';g.fillStyle='#f2f4f5';g.fillText('地上基地',325,16);
let start=Math.floor(camera);for(let y=start;y<Math.min(ROWS,start+21);y++)for(let x=0;x<C;x++){let v=grid[y][x],py=(y-camera)*T+26;if(py<-T||py>480)continue;g.fillStyle=colors[v];g.fillRect(x*T,py,T-1,T-1);if(v>1){g.fillStyle=v===5?'#ffe38b':v===4?'#d9d1bc':v===3?'#9ac2c6':'#24262a';for(let i=0;i<3;i++){let ox=(x*17+y*11+i*7)%17,oy=(x*7+y*19+i*9)%17;g.fillRect(x*T+3+ox,py+3+oy,4,4)}}if(v===0){g.fillStyle='#293541';g.fillRect(x*T+4,py+4,3,3)}}
for(let b of bots){let px=b.x*T,py=(b.y-camera)*T+26;if(py<-20||py>500)continue;g.fillStyle='#0006';g.beginPath();g.ellipse(px,py+8,10,4,0,0,Math.PI*2);g.fill();g.fillStyle=b.color;g.beginPath();g.roundRect(px-9,py-8,18,16,5);g.fill();g.fillStyle='#233d50';g.fillRect(px-6,py-3,12,6);g.fillStyle='#bdf5ff';g.fillRect(px-4,py-1,8,2);if(b.load){g.fillStyle='#f6c768';g.fillRect(px-4,py-15,8,6)}if(b.job==='掘削'&&b.target){g.strokeStyle='#ffe08b';g.lineWidth=3;g.beginPath();g.moveTo(px,py);g.lineTo(b.target.x*T+12,(b.target.y-camera)*T+38);g.stroke()}}
g.fillStyle='#ffffffb0';g.font='11px sans-serif';g.textAlign='right';for(let y=Math.ceil(camera/5)*5;y<camera+19&&y<ROWS;y+=5)g.fillText((y+1)*2+'m',590,(y-camera)*T+38);g.textAlign='left'}
function frame(t){let dt=Math.min(.08,(t-last)/1000||.016);last=t;if(run){acc+=dt*speed;let n=0;while(acc>=.04&&n++<25){tick(.04);acc-=.04}update()}draw();requestAnimationFrame(frame)}
$('start').onclick=()=>{run=!run;$('overlay').hidden=run;$('overlay').textContent='一時停止中';update()};$('speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;$('speed').textContent='速度 ×'+speed};$('reset').onclick=reset;
$('drill').onclick=()=>{let cost=20*drill;if(money>=cost){money-=cost;drill++;log('ドリルを Lv.'+drill+' に強化');update()}};
$('cargo').onclick=()=>{let cost=18*cargo;if(money>=cost){money-=cost;cargo++;log('運搬能力を Lv.'+cargo+' に強化');update()}};
$('hire').onclick=()=>{let cost=30+bots.length*18;if(money>=cost&&bots.length<12){money-=cost;bots.push(createBot());log('採掘ロボを追加');update()}};
reset();requestAnimationFrame(frame);
})();
</script></body></html>
