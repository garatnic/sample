<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工場自動化シミュレーター v0.1</title><style>*{box-sizing:border-box}body{margin:0;background:#111923;color:#edf3fa;font-family:system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:14px}h1{font-size:22px;margin:8px 0 4px}p{color:#b9c8d9;font-size:13px}.panel{background:#1e2b3b;border:1px solid #344b60;border-radius:11px;padding:10px;margin:9px 0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.stats>div{text-align:center}.stats strong{font-size:22px;display:block}.stats small{font-size:11px;color:#b7c8db}.board{position:relative}canvas{width:100%;display:block;background:#253342;border-radius:10px}.overlay{position:absolute;top:10px;left:10px;right:10px;text-align:center;background:#101923e8;border-radius:8px;padding:9px;font-size:13px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}button{border:1px solid #647f9e;background:#345270;color:#fff;padding:11px 4px;border-radius:8px;font-weight:700}.row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:5px 0;border-bottom:1px solid #ffffff18}.bar{height:6px;background:#435364;border-radius:5px;overflow:hidden;margin:4px 0 7px}.bar>div{height:100%;background:#5bbbd2}.log{white-space:pre-line;max-height:125px;overflow:auto;color:#bdcfdf;font-size:12px;line-height:1.65}.hint{font-size:12px;color:#b9c8d9}</style></head><body><main class="wrap"><h1>🏭 工場自動化シミュレーター</h1><p>材料搬入 → ロボット溶接 → 仕上げ → 検査 → 出荷。設備と作業員が自動で生産します。</p><div class="stats"><div class="panel"><strong id="out">0</strong><small>完成品</small></div><div class="panel"><strong id="wip">0</strong><small>仕掛品</small></div><div class="panel"><strong id="raw">0</strong><small>材料在庫</small></div><div class="panel"><strong id="time">0:00</strong><small>経過時間</small></div></div><div class="board"><canvas id="scene" width="720" height="430" aria-label="工場ラインの稼働アニメーション"></canvas><div id="overlay" class="overlay">▶ 開始を押すと生産が始まります</div></div><div class="buttons"><button id="start">▶ 開始</button><button id="speed">速度 ×1</button><button id="reset">↻ リセット</button></div><div class="panel"><b>生産ラインの状態</b><div id="stations"></div></div><div class="panel"><b>設備設定</b><div class="hint">工程の速度を変更して、生産のボトルネックを観察できます。</div><div class="row"><label for="weld">ロボット溶接</label><span id="weldv"></span></div><input id="weld" type="range" min="3" max="15" value="7" style="width:100%"><div class="row"><label for="finish">仕上げ</label><span id="finishv"></span></div><input id="finish" type="range" min="3" max="15" value="10" style="width:100%"><div class="row"><label for="inspect">検査</label><span id="inspectv"></span></div><input id="inspect" type="range" min="2" max="12" value="5" style="width:100%"></div><div class="panel"><b>生産ログ</b><div class="log" id="log"></div></div><p class="hint">v0.1 · 工程間バッファ・ロボット動作・搬送・出荷・設備速度調整。実設備には接続しないデモです。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('scene'),g=c.getContext('2d'),rand=(a,b)=>a+Math.random()*(b-a);
let running=false,speed=1,last=0,acc=0,clock=0,raw=8,out=0,nextId=1,parts=[],logs=[],supply=0,dispatch=0;
const stations=[{name:'ロボット溶接',x:175,y:180,duration:7,part:null,progress:0,from:'input',to:'welded',color:'#60a5fa'},{name:'仕上げ',x:370,y:180,duration:10,part:null,progress:0,from:'welded',to:'finished',color:'#fbbf24'},{name:'検査',x:555,y:180,duration:5,part:null,progress:0,from:'finished',to:'checked',color:'#4ade80'}];
const positions={input:{x:62,y:180},welded:{x:270,y:180},finished:{x:460,y:180},checked:{x:655,y:180}};
function log(s){logs.unshift('['+format(clock)+'] '+s);logs=logs.slice(0,30);$('log').textContent=logs.join('\n')}
function format(t){let s=Math.floor(t);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function makePart(){let p={id:nextId++,stage:'input',x:62,y:180,tx:62,ty:180,move:false,processing:false};parts.push(p);return p}
function reset(){running=false;speed=1;clock=0;raw=8;out=0;nextId=1;parts=[];logs=[];supply=0;dispatch=0;stations.forEach(s=>{s.part=null;s.progress=0});for(let i=0;i<3;i++){raw--;makePart()}log('生産ライン準備完了');$('speed').textContent='速度 ×1';$('overlay').hidden=false;$('overlay').textContent='▶ 開始を押すと生産が始まります';update()}
function update(){$('out').textContent=out;$('raw').textContent=raw;$('wip').textContent=parts.length;$('time').textContent=format(clock);$('start').textContent=running?'Ⅱ 一時停止':'▶ '+(clock?'再開':'開始');$('stations').innerHTML=stations.map(s=>{let waiting=parts.filter(p=>p.stage===s.from&&!p.processing&&!p.move).length;let percent=s.part?Math.min(100,s.progress/s.duration*100):0;return '<div class="row"><span>'+s.name+'</span><span>'+(s.part?'稼働中':'待機')+' / 待ち '+waiting+'個</span></div><div class="bar"><div style="width:'+percent+'%;background:'+s.color+'"></div></div>'}).join('')}
function moveTo(p,x,y){p.tx=x;p.ty=y;p.move=true}
function tick(dt){clock+=dt;supply+=dt;dispatch+=dt;
if(supply>=7){supply-=7;raw+=3;log('材料が3個入荷')}
if(raw>0&&parts.filter(p=>p.stage==='input').length<5){raw--;let p=makePart();p.x=20;p.y=330;moveTo(p,62,180)}
for(let p of parts)if(p.move){let dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),step=dt*110;if(d<=step){p.x=p.tx;p.y=p.ty;p.move=false}else{p.x+=dx/d*step;p.y+=dy/d*step}}
for(let s of stations){if(s.part){s.progress+=dt;if(s.progress>=s.duration){let p=s.part;s.part=null;s.progress=0;p.processing=false;p.stage=s.to;let dest=positions[s.to];moveTo(p,dest.x+rand(-12,12),dest.y+rand(-9,9));if(s.to==='checked')log('製品 #'+p.id+' 検査合格');}}
if(!s.part){let candidate=parts.find(p=>p.stage===s.from&&!p.move&&!p.processing);if(candidate){s.part=candidate;candidate.processing=true;s.progress=0;moveTo(candidate,s.x,s.y);}}}
if(dispatch>=1){dispatch=0;let p=parts.find(p=>p.stage==='checked'&&!p.move&&!p.processing);if(p){p.stage='shipping';moveTo(p,700,330)}}
for(let i=parts.length-1;i>=0;i--){let p=parts[i];if(p.stage==='shipping'&&!p.move){parts.splice(i,1);out++;log('製品 #'+p.id+' 出荷完了')}}
}
function rect(x,y,w,h,color,r=5){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function text(s,x,y,size=13,color='#e8f2fb'){g.fillStyle=color;g.font='bold '+size+'px system-ui';g.textAlign='center';g.fillText(s,x,y)}
function draw(){g.fillStyle='#273745';g.fillRect(0,0,720,430);
g.strokeStyle='#ffffff0b';g.lineWidth=1;for(let x=0;x<720;x+=30){g.beginPath();g.moveTo(x,0);g.lineTo(x,430);g.stroke()}for(let y=0;y<430;y+=30){g.beginPath();g.moveTo(0,y);g.lineTo(720,y);g.stroke()}
rect(12,55,100,270,'#314a59');text('材料倉庫',62,83);text('📦',62,125,28);text('在庫 '+raw,62,151,12);
rect(110,165,580,30,'#596776');for(let x=116;x<690;x+=22){g.fillStyle='#a1b2be';g.beginPath();g.arc(x,180,5,0,Math.PI*2);g.fill()}
for(let s of stations){rect(s.x-56,100,112,160,'#344f63');rect(s.x-47,113,94,123,'#1b2d3d');text(s.name,s.x,93,13);text(s.part?'● 稼働中':'○ 待機',s.x,251,11,s.part?'#80f3c0':'#b6c6d7');if(s.part){let phase=s.progress/s.duration,ax=s.x-35+Math.sin(phase*6)*22,ay=135+Math.cos(phase*6)*13;g.strokeStyle=s.color;g.lineWidth=8;g.lineCap='round';g.beginPath();g.moveTo(s.x-34,126);g.lineTo(ax,ay);g.lineTo(s.x+Math.sin(phase*8)*12,165);g.stroke();g.fillStyle='#f8c765';g.beginPath();g.arc(s.x+Math.sin(phase*8)*12,165,5,0,Math.PI*2);g.fill();if(s===stations[0]){for(let i=0;i<3;i++){let a=clock*12+i*2;g.fillStyle='#ffe26b';g.fillRect(s.x+Math.cos(a)*rand(5,12),170+Math.sin(a)*rand(4,12),3,3)}}}}
for(let p of parts){rect(p.x-10,p.y-8,20,16,p.processing?'#f4b95d':p.stage==='checked'?'#70db9a':'#b7c7d5',3);g.strokeStyle='#243744';g.strokeRect(p.x-10,p.y-8,20,16)}
rect(585,315,125,65,'#345f52');text('🚚 出荷',648,355,18);rect(15,353,215,45,'#172a39');text('自動生産ライン',122,380,16);
for(let i=0;i<3;i++){let x=260+i*130+Math.sin(clock*.5+i)*15,y=330+Math.cos(clock*.7+i)*18;g.fillStyle=['#7ac8f6','#f5d080','#e0a5f6'][i];g.beginPath();g.arc(x,y,9,0,Math.PI*2);g.fill();g.fillStyle='#ffe0bd';g.beginPath();g.arc(x,y-9,6,0,Math.PI*2);g.fill();text(['運搬','仕上げ','検査'][i],x,y+24,10)}}
function loop(t){let dt=Math.min(.1,(t-last)/1000||.016);last=t;if(running){acc+=dt*speed;let n=0;while(acc>=.04&&n++<30){tick(.04);acc-=.04}update()}draw();requestAnimationFrame(loop)}
$('start').onclick=()=>{running=!running;$('overlay').hidden=running;$('overlay').textContent='一時停止中';update()};
$('speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;$('speed').textContent='速度 ×'+speed};
$('reset').onclick=reset;
for(let [id,i] of [['weld',0],['finish',1],['inspect',2]]){const el=$(id),label=$(id+'v');const set=()=>{stations[i].duration=Number(el.value);label.textContent=el.value+'秒 / 個'};el.addEventListener('input',set);set()}
reset();requestAnimationFrame(loop);
})();
</script></body></html>
