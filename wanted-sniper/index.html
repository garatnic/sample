<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WANTED SNIPER</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#10141b;color:#f7f8fa;font-family:system-ui,sans-serif;overscroll-behavior:none}main{max-width:520px;margin:auto;padding:4px;height:100dvh;display:flex;flex-direction:column;overflow:hidden}.hud{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:8px 2px}#scene{position:relative;width:100%;flex:1;min-height:0;overflow:hidden;border-radius:10px 10px 0 0;background:#7294a9}#city{position:absolute;inset:0;width:100%;height:100%}#people{position:absolute;inset:0;pointer-events:none}.person{position:absolute;transform:translate(-50%,-100%);pointer-events:none}#scope{position:absolute;width:72px;height:72px;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid white;border-radius:50%;z-index:5;pointer-events:none;box-shadow:0 0 0 1px #19232d,0 0 7px #0009}#scope:before{content:"";position:absolute;top:50%;left:-12px;right:-12px;border-top:1px solid white}#scope:after{content:"";position:absolute;left:50%;top:-12px;bottom:-12px;border-left:1px solid white}#scope .dot{position:absolute;left:50%;top:50%;width:5px;height:5px;background:#ff4b4b;border-radius:50%;transform:translate(-50%,-50%)}#lens{position:absolute;inset:0;border-radius:50%;overflow:hidden;z-index:-1;background:#8298a7}#lensInner{position:absolute;top:0;left:0;transform-origin:top left;pointer-events:none}#pad{height:clamp(140px,27dvh,260px);flex:none;background:#050608;touch-action:none;user-select:none;border-radius:0 0 10px 10px;display:flex;align-items:center;justify-content:center;color:#626e7b;font-size:13px;text-align:center}#pad.active{background:#111722}#poster{position:absolute;top:8px;left:8px;z-index:6;display:flex;align-items:center;gap:4px;background:#e8d4a4;color:#352515;border:3px solid #ac8553;border-radius:8px;padding:4px;margin:0;min-height:0;box-shadow:0 2px 8px #0007}#portrait{width:52px;height:64px;background:#bdac8a;flex:none;border:2px solid #806444;display:flex;align-items:center;justify-content:center}#portrait svg{width:46px;height:61px}#poster strong{font-size:11px;letter-spacing:1px}#poster p{display:none}#poster b{font-size:10px}#overlay{position:absolute;inset:0;background:#0d1c2cdd;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;gap:12px}#overlay p{font-size:13px;line-height:1.8}button{background:#eec66e;border:0;color:#211b11;border-radius:9px;padding:10px 17px;font-weight:800}footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:9px;font-size:12px;color:#c5d0d8}.burst{position:absolute;width:16px;height:16px;border:2px solid #ffe4a0;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:7;animation:burst .3s forwards}@keyframes burst{to{opacity:0;transform:translate(-50%,-50%) scale(4)}}#flash{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0}
</style></head><body><main>
<div class="hud"><span>得点 <b id="score">0</b></span><span>正解 <b id="hits">0</b></span><span>誤射 <b id="mistakes">0</b></span><span>残り <b id="time">90</b>秒</span></div>
<div id="scene">
<svg id="city" viewBox="0 0 360 400" preserveAspectRatio="none"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#41688b"/><stop offset="1" stop-color="#b5c9cd"/></linearGradient><pattern id="windows" width="25" height="29" patternUnits="userSpaceOnUse"><rect x="6" y="7" width="12" height="16" fill="#acc6cc" opacity=".7"/></pattern></defs><rect width="360" height="400" fill="url(#sky)"/><circle cx="288" cy="58" r="25" fill="#e9dfbd"/><g fill="#6e8694"><rect x="0" y="172" width="62" height="228"/><rect x="76" y="190" width="53" height="210"/><rect x="218" y="164" width="60" height="236"/><rect x="297" y="175" width="63" height="225"/></g><rect x="4" y="227" width="106" height="173" fill="#4c6576"/><rect x="4" y="227" width="106" height="173" fill="url(#windows)"/><rect x="0" y="221" width="114" height="9" fill="#2e485a"/><rect x="119" y="130" width="121" height="270" fill="#687c8c"/><rect x="119" y="130" width="121" height="270" fill="url(#windows)"/><rect x="115" y="124" width="129" height="10" fill="#3f5869"/><rect x="253" y="240" width="105" height="160" fill="#40596c"/><rect x="253" y="240" width="105" height="160" fill="url(#windows)"/><rect x="248" y="234" width="112" height="9" fill="#294455"/><path d="M145 124V105H176V124M194 124V101H224V124M28 221V204H64V221M279 234V214H318V234" fill="none" stroke="#304859" stroke-width="3"/></svg>
<div id="people"></div><div id="poster"><div id="portrait"></div><div><strong>WANTED</strong><p>このキャラクターを探せ！</p><b id="wantedName">ゲームを開始してください</b></div></div><div id="scope"><div id="lens"><div id="lensInner"></div></div><div class="dot"></div></div><div id="flash"></div>
<div id="overlay"><h2 id="title">WANTED SNIPER</h2><p id="desc">指名手配書と同じキャラクターを探そう！<br>黒いエリアをスワイプして照準移動<br>指を離すと射撃。違う人を撃つと減点！</p><button id="start">ゲーム開始</button></div></div>
<div id="pad">ここでスワイプして照準を動かす<br>指を離すと射撃</div>
<footer><span id="status">正解 +500 / 誤射 -200</span><button id="restart">リスタート</button></footer>
</main><script>
(()=>{const $=id=>document.getElementById(id),scene=$('scene'),pad=$('pad'),layer=$('people'),scope=$('scope');const slots=[{x:29,y:221,s:18,r:7},{x:78,y:221,s:18,r:7},{x:145,y:124,s:13,r:6},{x:184,y:124,s:13,r:6},{x:220,y:124,s:13,r:6},{x:280,y:234,s:19,r:7},{x:327,y:234,s:19,r:7},{x:143,y:210,s:16,r:4},{x:207,y:269,s:16,r:4},{x:60,y:298,s:18,r:5},{x:31,y:273,s:16,r:4},{x:81,y:325,s:16,r:4},{x:144,y:184,s:15,r:4},{x:182,y:212,s:15,r:4},{x:220,y:241,s:15,r:4},{x:280,y:294,s:18,r:4},{x:328,y:322,s:18,r:4},{x:148,y:327,s:16,r:4},{x:204,y:353,s:16,r:4},{x:280,y:353,s:18,r:4}];const colors=['#e45353','#4ba4e5','#f3c54e','#64b67c','#a67bd6','#e78c4d','#54bcb5','#d16ba5','#8b99aa','#a5c747','#d86932','#287ba0','#b99a47','#426d43','#cb84e5','#b65a81','#33a48d','#7e574c','#5767d4','#d2adba'];const names=['アカマル','アオボウ','キイロ','ミドリン','ムラサキ','オレンジ','ミント','ピンク','グレー','ライム','レンガ','アオミズ','コガネ','モリ','フジ','ローズ','クジャク','ココア','インディゴ','サクラ'];let people=[],wanted=null,score=0,hits=0,mistakes=0,time=90,playing=false,ax=180,ay=200,held=false,px=0,py=0,last=0,raf=0,round=0;
function avatar(id){let c=colors[id],hat=id%3,eye=id%4,shape=id%2;return '<svg viewBox="0 0 32 52" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><path d="M9 34L8 51M23 34L24 51" stroke="'+(id%2?'#34465e':'#3d354a')+'" stroke-width="7"/><path d="M5 21L27 21L29 39L3 39Z" fill="'+c+'" stroke="#27313b" stroke-width="1.5"/><path d="M5 25L1 35M27 25L31 35" stroke="#d4a47e" stroke-width="4"/>'+(shape?'<rect x="8" y="5" width="16" height="18" rx="4" fill="#e1b28a"/>':'<ellipse cx="16" cy="14" rx="9" ry="11" fill="#e1b28a"/>')+(hat===0?'<path d="M5 9L8 2H24L27 9Z" fill="'+c+'"/><path d="M4 9H29" stroke="#29333c" stroke-width="3"/>':hat===1?'<path d="M7 7Q16 -2 25 7L25 10H7Z" fill="#343d49"/>':'<path d="M7 8L10 4H22L25 8" stroke="#7c5135" stroke-width="3"/>')+(eye===0?'<rect x="9" y="12" width="14" height="5" rx="2" fill="#263746"/>':eye===1?'<circle cx="12" cy="14" r="1.5"/><circle cx="20" cy="14" r="1.5"/>':eye===2?'<path d="M10 14H14M18 14H22" stroke="#263746" stroke-width="2"/>':'<circle cx="12" cy="14" r="2" fill="#263746"/><path d="M19 14H23" stroke="#263746" stroke-width="2"/>')+'<path d="M12 20Q16 23 20 20" stroke="#784c3c" fill="none" stroke-width="1.2"/></svg>'}
function hud(){$('score').textContent=score;$('hits').textContent=hits;$('mistakes').textContent=mistakes;$('time').textContent=Math.ceil(time)}
function drawAim(){scope.style.left=ax/360*100+'%';scope.style.top=ay/400*100+'%';zoom()}
function zoom(){let z=$('lensInner'),w=scene.clientWidth,h=scene.clientHeight,mag=2.6;z.style.width=w+'px';z.style.height=h+'px';z.style.transform='translate('+(36-ax*w/360*mag)+'px,'+(36-ay*h/400*mag)+'px) scale('+mag+')';z.innerHTML=scene.querySelector('#city').outerHTML+layer.outerHTML;let svg=z.querySelector('svg');svg.removeAttribute('id');svg.style.width='100%';svg.style.height='100%';svg.style.position='absolute';svg.style.inset='0';let p=z.querySelector('#people');if(p){p.removeAttribute('id');p.style.position='absolute';p.style.inset='0'}}
function createRound(){layer.innerHTML='';people=[];let ids=Array.from({length:20},(_,i)=>i);for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}slots.forEach((s,i)=>{let id=ids[i],node=document.createElement('div');node.className='person';node.innerHTML=avatar(id);layer.appendChild(node);people.push({id,s,node,x:s.x,phase:Math.random()*6.28,peek:Math.random()*6.28,shown:true})});wanted=people[Math.floor(Math.random()*people.length)];$('portrait').innerHTML=avatar(wanted.id);$('wantedName').textContent=names[wanted.id];$('status').textContent='指名手配の人物を見つけよう';zoom()}
function shoot(){let m=document.createElement('div');m.className='burst';m.style.left=ax/360*100+'%';m.style.top=ay/400*100+'%';scene.appendChild(m);setTimeout(()=>m.remove(),320);let target=people.find(p=>p.shown&&Math.abs(ax-p.x)<p.s.s*.42&&ay>=p.s.y-p.s.s*1.6&&ay<=p.s.y);if(!target){$('status').textContent='空振り';return}if(target.id===wanted.id){score+=500;hits++;$('status').textContent='正解！ +500点';round++;createRound()}else{score=Math.max(0,score-200);mistakes++;$('status').textContent='違うキャラクター！ -200点'}hud()}
function end() {playing=false;cancelAnimationFrame(raf);$('title').textContent='TIME UP';$('desc').textContent='得点 '+score+'点 / 正解 '+hits+'人 / 誤射 '+mistakes+'人';$('start').textContent='もう一度プレイ';$('overlay').style.display='flex'}
function frame(t){if(!playing)return;let dt=Math.min((t-last)/1000,.05);last=t;time-=dt;if(time<=0){time=0;hud();end();return}for(let p of people){p.phase+=dt*(.25+p.id*.008);p.peek+=dt*(.55+p.id*.012);p.shown=Math.sin(p.peek)>-.35;p.x=p.s.x+Math.sin(p.phase)*p.s.r;p.node.style.display=p.shown?'block':'none';p.node.style.left=p.x/360*100+'%';p.node.style.top=p.s.y/400*100+'%';p.node.style.width=p.s.s/360*100+'%';p.node.style.height=p.s.s*1.6/400*100+'%'}zoom();hud();raf=requestAnimationFrame(frame)}
function start(){cancelAnimationFrame(raf);score=0;hits=0;mistakes=0;time=90;round=0;playing=true;held=false;ax=180;ay=200;$('overlay').style.display='none';createRound();drawAim();hud();last=performance.now();raf=requestAnimationFrame(frame)}
pad.addEventListener('pointerdown',e=>{if(!playing)return;held=true;px=e.clientX;py=e.clientY;pad.setPointerCapture(e.pointerId);pad.classList.add('active');e.preventDefault()});pad.addEventListener('pointermove',e=>{if(!held||!playing)return;let r=scene.getBoundingClientRect();ax=Math.max(0,Math.min(360,ax+(e.clientX-px)*360/r.width));ay=Math.max(0,Math.min(400,ay+(e.clientY-py)*400/r.height));px=e.clientX;py=e.clientY;drawAim();e.preventDefault()});pad.addEventListener('pointerup',e=>{if(!held)return;held=false;pad.classList.remove('active');if(playing)shoot();e.preventDefault()});pad.addEventListener('pointercancel',()=>{held=false;pad.classList.remove('active')});$('start').addEventListener('click',start);$('restart').addEventListener('click',start);drawAim();hud()})();
</script></body></html>
