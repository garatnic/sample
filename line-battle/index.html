<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ラインバトル v0.1</title><style>*{box-sizing:border-box}body{margin:0;background:#111b27;color:#eef4fa;font-family:system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:14px}h1{font-size:23px;margin:8px 0}p{font-size:13px;color:#b6c8d8}.panel{background:#1f3041;border:1px solid #3d5369;border-radius:11px;padding:10px;margin:9px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;text-align:center}.stats strong{display:block;font-size:21px}.stats small{font-size:11px;color:#b9c9d8}canvas{width:100%;display:block;background:#9bc8df;border-radius:10px;touch-action:manipulation}.board{position:relative}.overlay{position:absolute;top:12px;left:12px;right:12px;text-align:center;background:#142333e8;padding:10px;border-radius:8px;font-size:14px}.units{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.units button{font-size:12px;line-height:1.5}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button{background:#345875;color:#fff;border:1px solid #6987a2;border-radius:9px;padding:10px 3px;font-weight:bold}button:disabled{opacity:.42}.bar{height:9px;background:#334556;border-radius:8px;overflow:hidden}.bar>div{height:100%;background:#58d39a}.log{white-space:pre-line;height:95px;overflow:auto;color:#c1d0dc;font-size:12px;line-height:1.7}.hint{font-size:12px;color:#bdcbd7}</style></head><body><main class="wrap"><h1>⚔️ ラインバトル</h1><p>左が味方、右が敵。仲間を出撃させて敵の城を破壊しよう！</p><div class="stats"><div class="panel"><strong id="money">0</strong><small>💰 お金</small></div><div class="panel"><strong id="income">0</strong><small>収入 / 秒</small></div><div class="panel"><strong id="time">0:00</strong><small>経過時間</small></div><div class="panel"><strong id="kills">0</strong><small>撃破数</small></div></div><div class="board"><canvas id="battle" width="720" height="360" aria-label="左右からユニットが戦うラインバトル"></canvas><div id="overlay" class="overlay">▶ 開始を押してバトルスタート！</div></div><div class="panel"><div style="display:flex;justify-content:space-between;font-size:12px"><span>🏰 味方の城 <b id="allyhp">1000</b></span><span>敵の城 <b id="enemyhp">1000</b> 🏯</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:7px"><div class="bar"><div id="allybar" style="width:100%"></div></div><div class="bar"><div id="enemybar" style="width:100%;background:#f07878"></div></div></div></div><div class="panel"><b>ユニット出撃</b><div class="units" style="margin-top:9px"><button data-unit="soldier">⚔️ 歩兵<br>50G</button><button data-unit="tank">🛡️ タンク<br>100G</button><button data-unit="archer">🏹 射手<br>150G</button><button data-unit="mage">✨ 魔法使い<br>250G</button></div><p class="hint">出撃後は自動で前進・攻撃。魔法使いは範囲攻撃ができます。</p></div><div class="controls"><button id="start">▶ 開始</button><button id="speed">速度 ×1</button><button id="reset">↻ リセット</button></div><div class="panel"><b>経済強化</b><p class="hint" id="economy"></p><button id="upgrade">💰 収入を強化</button></div><div class="panel"><b>戦闘ログ</b><div class="log" id="log"></div></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('battle'),g=canvas.getContext('2d'),W=720,H=360;
const cfg={soldier:{name:'歩兵',cost:50,hp:80,atk:12,range:24,rate:.7,move:36,color:'#60b9f8',icon:'⚔'},tank:{name:'タンク',cost:100,hp:260,atk:8,range:25,rate:1.1,move:21,color:'#f6c15f',icon:'⬟'},archer:{name:'射手',cost:150,hp:65,atk:20,range:125,rate:1.2,move:30,color:'#7ee5a4',icon:'➶'},mage:{name:'魔法使い',cost:250,hp:85,atk:29,range:105,rate:1.8,move:24,color:'#c59aff',icon:'✦'}};
let units=[],effects=[],money=160,income=12,incomeLevel=1,allyHP=1000,enemyHP=1000,elapsed=0,kills=0,spawn=0,run=false,speed=1,last=0,acc=0,over=false,logs=[],nextId=1;
function log(s){logs.unshift('• '+s);logs=logs.slice(0,24);$('log').textContent=logs.join('\n')}
function create(side,type){let c=cfg[type];units.push({id:nextId++,side,type,x:side===1?75:645,y:269+(Math.random()-.5)*17,hp:c.hp*(side===-1?1+elapsed/230:1),max:c.hp*(side===-1?1+elapsed/230:1),cool:Math.random()*.4,flash:0})}
function reset(){units=[];effects=[];money=160;income=12;incomeLevel=1;allyHP=1000;enemyHP=1000;elapsed=0;kills=0;spawn=3;run=false;speed=1;over=false;logs=[];nextId=1;$('speed').textContent='速度 ×1';$('overlay').hidden=false;$('overlay').textContent='▶ 開始を押してバトルスタート！';log('防衛戦の準備完了');update()}
function update(){$('money').textContent=Math.floor(money);$('income').textContent=income;$('time').textContent=Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');$('kills').textContent=kills;$('allyhp').textContent=Math.ceil(allyHP);$('enemyhp').textContent=Math.ceil(enemyHP);$('allybar').style.width=allyHP/10+'%';$('enemybar').style.width=enemyHP/10+'%';$('start').textContent=run?'Ⅱ 一時停止':'▶ '+(elapsed?'再開':'開始');let cost=80*incomeLevel;$('upgrade').textContent='💰 収入 Lv.'+incomeLevel+' → '+(incomeLevel+1)+' ('+cost+'G)';$('upgrade').disabled=money<cost||over;$('economy').textContent='毎秒 '+income+'G 自動獲得。強化すると収入が増加します。';document.querySelectorAll('[data-unit]').forEach(b=>b.disabled=money<cfg[b.dataset.unit].cost||over)}
function hit(v,damage,side){v.hp-=damage;v.flash=.12;if(v.hp<=0){v.dead=true;if(side===1){kills++;money+=Math.round(cfg[v.type].cost*.4);if(kills%10===0)log('敵を '+kills+'体撃破！')}}}
function step(dt){if(over)return;elapsed+=dt;money=Math.min(9999,money+income*dt);spawn-=dt;if(spawn<=0){let r=Math.random(),type=elapsed>70&&r>.87?'mage':elapsed>40&&r>.68?'archer':r>.43?'tank':'soldier';create(-1,type);spawn=Math.max(.85,3.2-elapsed*.012)*(Math.random()*.5+.75)}
for(let u of units){if(u.dead)continue;let c=cfg[u.type];u.cool-=dt;u.flash=Math.max(0,u.flash-dt);let foes=units.filter(v=>!v.dead&&v.side!==u.side);let target=foes.sort((a,b)=>Math.abs(a.x-u.x)-Math.abs(b.x-u.x))[0];let inRange=target&&Math.abs(target.x-u.x)<=c.range+9;if(inRange){if(u.cool<=0){let victims=u.type==='mage'?foes.filter(v=>Math.abs(v.x-target.x)<50):[target];for(let v of victims)hit(v,c.atk,u.side);effects.push({x:u.x,y:u.y-8,tx:target.x,ty:target.y-8,life:.18,color:c.color});u.cool=c.rate}}else{let castle=u.side===1?670:50;if((u.side===1&&u.x>=castle)||(u.side===-1&&u.x<=castle)){if(u.cool<=0){if(u.side===1)enemyHP=Math.max(0,enemyHP-c.atk);else allyHP=Math.max(0,allyHP-c.atk);u.cool=c.rate}}else{let nx=u.x+u.side*c.move*dt;let blocked=units.some(v=>v!==u&&!v.dead&&v.side===u.side&&Math.abs(v.x-nx)<16&&((u.side===1&&v.x>u.x)||(u.side===-1&&v.x<u.x)));if(!blocked)u.x=nx}}}
units=units.filter(u=>!u.dead);for(let e of effects)e.life-=dt;effects=effects.filter(e=>e.life>0);if(allyHP<=0||enemyHP<=0){over=true;run=false;$('overlay').hidden=false;$('overlay').textContent=enemyHP<=0?'🎉 勝利！ 敵の城を破壊しました':'💀 敗北！ 味方の城が陥落しました';log(enemyHP<=0?'敵の城を制圧！':'味方の城が陥落…')}update()}
function draw(){let sky=g.createLinearGradient(0,0,0,270);sky.addColorStop(0,'#78b7e3');sky.addColorStop(1,'#d8e5bc');g.fillStyle=sky;g.fillRect(0,0,W,H);g.fillStyle='#9fb68a';for(let i=0;i<9;i++){g.beginPath();g.arc(i*100-10,250,80,Math.PI,0);g.fill()}g.fillStyle='#789d63';g.fillRect(0,260,W,100);g.fillStyle='#a68b65';g.fillRect(0,292,W,35);for(let i=0;i<36;i++){g.fillStyle='#ffffff18';g.fillRect(i*21,300,11,2)}
function castle(x,color,flip){g.fillStyle='#38434b';g.fillRect(x-29,197,58,104);g.fillStyle=color;g.fillRect(x-25,204,50,83);g.fillStyle='#28343e';g.fillRect(x-11,261,22,40);for(let i=-1;i<=1;i++)g.fillRect(x+i*19-8,188,15,18);g.fillStyle='#f4d36d';g.beginPath();g.moveTo(x,175);g.lineTo(x+22,193);g.lineTo(x,193);g.fill();g.fillStyle='#fff';g.font='bold 12px system-ui';g.textAlign='center';g.fillText(flip?'敵':'味方',x,222)}
castle(35,'#5289c7',false);castle(685,'#c96b68',true);
for(let u of units){let c=cfg[u.type],x=u.x,y=u.y;g.fillStyle='#182c3488';g.beginPath();g.ellipse(x,y+17,13,5,0,0,Math.PI*2);g.fill();g.fillStyle=u.flash?'#fff':u.side===1?c.color:'#f16e73';g.beginPath();g.roundRect(x-11,y-13,22,26,7);g.fill();g.fillStyle='#243747';g.beginPath();g.arc(x,y-17,8,0,Math.PI*2);g.fill();g.fillStyle='#fff';g.font='bold 14px system-ui';g.textAlign='center';g.fillText(c.icon,x,y+5);g.fillStyle='#283443';g.fillRect(x-15,y-31,30,4);g.fillStyle=u.side===1?'#60e8a0':'#ffb37a';g.fillRect(x-15,y-31,30*Math.max(0,u.hp/u.max),4)}
for(let e of effects){g.globalAlpha=e.life/.18;g.strokeStyle=e.color;g.lineWidth=3;g.beginPath();g.moveTo(e.x,e.y);g.lineTo(e.tx,e.ty);g.stroke();g.globalAlpha=1}}
function frame(t){let dt=Math.min(.08,(t-last)/1000||.016);last=t;if(run){acc+=dt*speed;let n=0;while(acc>=.025&&n++<20){step(.025);acc-=.025}}draw();requestAnimationFrame(frame)}
document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{let type=b.dataset.unit;if(money>=cfg[type].cost&&!over){money-=cfg[type].cost;create(1,type);update()}});
$('upgrade').onclick=()=>{let cost=80*incomeLevel;if(money>=cost&&!over){money-=cost;incomeLevel++;income+=8;log('収入を Lv.'+incomeLevel+' に強化');update()}};
$('start').onclick=()=>{if(over)return;run=!run;$('overlay').hidden=run;$('overlay').textContent='一時停止中';update()};$('speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;$('speed').textContent='速度 ×'+speed};$('reset').onclick=reset;reset();requestAnimationFrame(frame);
})();
</script></body></html>
